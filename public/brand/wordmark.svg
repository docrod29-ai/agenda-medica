<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="Ausculta">
  <!--
    LOGOTIPO HORIZONTAL DE AUSCULTA — marca + nombre.
    Para el encabezado de acceso, la barra lateral y materiales.

    El nombre va en IBM Plex Sans, la misma que usa toda la aplicación desde
    que se retiró Geist (la fuente de fábrica de Vercel). Un logotipo escrito
    en una fuente que el producto no usa se delata al ponerlo al lado de
    cualquier pantalla.

    `currentColor` en todo: hereda el color del tema. La versión anterior
    llevaba clavado el azul que no pasaba contraste.
  -->
  <g transform="translate(14, 24)" color="currentColor">
    <g fill="none" stroke="currentColor" stroke-linecap="round">
      <circle cx="17" cy="24" r="8.5" stroke-width="3.2"/>
      <circle cx="17" cy="24" r="2.6" fill="currentColor" stroke="none"/>
      <path d="M31 17.5a9 9 0 0 1 0 13" stroke-width="3.2"/>
      <path d="M37.5 12a17 17 0 0 1 0 24" stroke-width="3.2" opacity="0.45"/>
    </g>
  </g>

  <text x="86" y="61" font-family="'IBM Plex Sans', system-ui, sans-serif"
        font-weight="600" font-size="38" fill="currentColor" letter-spacing="-0.8">Ausculta</text>
</svg>
