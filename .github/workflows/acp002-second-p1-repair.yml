name: ACP-002 Second P1 Repair

on:
  pull_request:
    types: [synchronize]
    paths:
      - '.github/workflows/acp002-second-p1-repair.yml'

concurrency:
  group: ausculta-acp002-second-p1-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'claude/acp-001-codex-verdict-zwzvjk'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    env:
      REPAIR_BRANCH: claude/acp-001-codex-verdict-zwzvjk
      VERDICT_PATH: control-plane/verdicts/acp002-codex-verdict-31963800078.json
      EXPECTED_AUDITED_SHA: 821a44b0da15959041e4af22990b2bcd499a59a7
    steps:
      - name: Checkout exact PR head without credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify immutable FAIL and canonical repair state
        shell: bash
        run: |
          set -euo pipefail
          test -f "$VERDICT_PATH"
          jq -e --arg sha "$EXPECTED_AUDITED_SHA" \
            '.verdict == "FAIL" and .audited_sha == $sha and .independent == true and .read_only == true and ([.findings[] | select(.severity == "P1" and .blocking == true)] | length) == 7' \
            "$VERDICT_PATH" >/dev/null
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const board = JSON.parse(readFileSync('control-plane/MASTER_BOARD.json','utf8'))
          const item = board.items.find(x => x.id === 'ACP-002')
          const next = board.items.find(x => x.id === 'ACP-003')
          if (!item || item.status !== 'REPAIR_READY') throw new Error(`ACP-002 must be REPAIR_READY, got ${item?.status}`)
          if (!next || next.status !== 'QUEUED') throw new Error(`ACP-003 must remain QUEUED, got ${next?.status}`)
          for (const key of ['production_deploy_authorized','main_merge_authorized','phi_allowed','destructive_changes_authorized','clinical_policy_changes_authorized','production_secret_rotation_authorized']) {
            if (board.execution_policy?.[key] !== false) throw new Error(`fail-closed policy drift: ${key}`)
          }
          writeFileSync('/tmp/board-before.json', JSON.stringify(board, null, 2))
          NODE

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run one bounded Claude Opus repair
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/prompt.txt <<'PROMPT'
          AUSCULTA-AUTONOMOUS-CONTROL-PLANE-001 — ACP-002 SECOND BOUNDED P1 REPAIR

          You are CLAUDE_OPUS, the ONE WRITER. Codex remains the independent read-only judge.
          The immutable authority is control-plane/verdicts/acp002-codex-verdict-31963800078.json: FAIL against 821a44b0da15959041e4af22990b2bcd499a59a7 with exactly seven blocking P1 findings.

          Read completely before editing: CLAUDE.md, AGENTS.md, control-plane/BASELINE.md, control-plane/MASTER_BOARD.json, control-plane/MASTER_BOARD.schema.json, control-plane/kernel.mjs, control-plane/preflight.mjs, control-plane/preflight.test.mjs, control-plane/scope-guard.mjs, control-plane/scope-guard.test.mjs, control-plane/item-scopes.json, .github/workflows/control-plane-writer.yml, .github/workflows/acp002-codex-judge.yml, and the immutable verdict above.

          Repair ONLY these seven P1s:
          1) Credential scan must fail closed at arbitrary nesting depth without a depth-bypass; remain cycle-safe and bounded against DoS by a defensible node/size budget that FAILS rather than stops scanning.
          2) writerPermissionsFromWorkflow must be job-bounded: missing writer permissions must never bleed into the next job. Missing/unparseable/empty blocks fail closed. Add adversarial tests.
          3) Retry ceiling must survive a FRESH workflow_dispatch, not only GITHUB_RUN_ATTEMPT. Implement durable, repository-visible invocation accounting or another mechanically enforceable scheme tied to item + authorized SHA. max_retries=0 must make a second fresh dispatch impossible before Claude invocation. Do not depend on mutable prose. Avoid schema/kernel changes unless absolutely necessary; prefer a dedicated deterministic control-plane ledger/guard with focused tests and a pre-writer mechanical step.
          4) The writer must not be able to rewrite its own post-write enforcement. The authoritative scope declaration and enforcement logic used AFTER the writer must be immutable to that writer invocation: snapshot/copy/hash them before Claude runs and execute/compare against the pre-writer trusted copy, or otherwise structurally separate writer-editable implementation from enforcement. A writer for ACP-002 must not weaken a guard then modify ACP-003.
          5) Branch/token fence must not trust writer-mutable .git metadata. Before the token-bearing push, use a fresh mechanically created checkout/repository or otherwise prove and reset all relevant git config/remotes/url rewrites. The push destination and branch must be pinned independently of writer-mutated repository metadata. Token appears only in the final mechanical push context.
          6) Complete reverse proofs: condition 5 needs a real removal/inversion proof, and condition 2 must prove overall unsafe authorization (result.ok === true and authorized != null) when the relevant guard is removed, with unrelated gates valid. Do not make claims stronger than the mutant demonstrates.
          7) Cloud attestation must be genuinely successful for the repaired candidate BEFORE freezing. Fix the attestation harness so it supplies every new preflight field, inspects real judge workflow permissions, and proves fail-closed behavior in GitHub Actions. The freeze workflow must consume exact successful CI + attestation evidence for the same candidate SHA; evidence added after the fact is invalid.

          REQUIRED STATE: ACP-002 currently REPAIR_READY. Record REPAIR_READY -> RUNNING_WRITER -> WRITER_DONE truthfully in ACP-002 evidence only. Do not advance to CI_PENDING/SHA_FROZEN/RUNNING_JUDGE. Do not touch ACP-003 or later records.

          HARD BOUNDARIES: no product/clinical code, Firestore, deployment, main/master, PHI, secrets, billing, destructive action, clinical policy, merge, or deploy. Do not weaken tests/gates. Do not commit or push. You have NO Bash/Web tools intentionally.

          ALLOWED EDITS:
          - control-plane/preflight.mjs
          - control-plane/preflight.test.mjs
          - control-plane/scope-guard.mjs
          - control-plane/scope-guard.test.mjs
          - control-plane/item-scopes.json
          - control-plane/MASTER_BOARD.json
          - control-plane/writer-attempt-guard.mjs (optional new)
          - control-plane/writer-attempt-guard.test.mjs (optional new)
          - control-plane/writer-attempts.json (optional new durable ledger template/state)
          - .github/workflows/control-plane-writer.yml
          - .github/workflows/acp002-freeze-and-judge.yml

          kernel.mjs and MASTER_BOARD.schema.json are OUT OF SCOPE. If you cannot solve all seven within these boundaries, stop without pretending success.
          Final response: READY_FOR_VERIFICATION=YES only if all seven P1s are fully addressed.
          PROMPT

          claude -p "$(cat /tmp/prompt.txt)" \
            --model opus \
            --max-turns 120 \
            --output-format json \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" "WebSearch" "WebFetch" \
            2>&1 | tee /tmp/claude-repair.log

      - name: Enforce emergency repair scope and ACP-002-only board delta
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          test -n "$status"
          printf '%s\n' "$status"
          while IFS= read -r line; do
            path="${line:3}"
            path="${path##* -> }"
            case "$path" in
              control-plane/preflight.mjs|control-plane/preflight.test.mjs|control-plane/scope-guard.mjs|control-plane/scope-guard.test.mjs|control-plane/item-scopes.json|control-plane/MASTER_BOARD.json|control-plane/writer-attempt-guard.mjs|control-plane/writer-attempt-guard.test.mjs|control-plane/writer-attempts.json|.github/workflows/control-plane-writer.yml|.github/workflows/acp002-freeze-and-judge.yml) ;;
              *) echo "::error::FORBIDDEN_SCOPE_CHANGE: $path"; exit 80 ;;
            esac
          done <<< "$status"

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const before = JSON.parse(readFileSync('/tmp/board-before.json','utf8'))
          const after = JSON.parse(readFileSync('control-plane/MASTER_BOARD.json','utf8'))
          const b = before.items.find(x => x.id === 'ACP-002')
          const a = after.items.find(x => x.id === 'ACP-002')
          if (!a || a.status !== 'WRITER_DONE') throw new Error(`ACP-002 must finish WRITER_DONE, got ${a?.status}`)
          const strip = x => ({...x, items:x.items.filter(i => i.id !== 'ACP-002')})
          if (JSON.stringify(strip(before)) !== JSON.stringify(strip(after))) throw new Error('foreign item or governance changed')
          if (a.id !== b.id || a.owner !== b.owner || JSON.stringify(a.dependencies) !== JSON.stringify(b.dependencies)) throw new Error('ACP-002 identity/dependency drift')
          const ev = Array.isArray(a.evidence) ? a.evidence.join('\n') : ''
          for (const token of ['31963800078','REPAIR_READY','RUNNING_WRITER','WRITER_DONE']) if (!ev.includes(token)) throw new Error(`missing evidence ${token}`)
          NODE

      - name: Verify focused contract
        shell: bash
        run: |
          set -euo pipefail
          node --test control-plane/*.test.mjs
          node control-plane/kernel.mjs check

      - name: Commit and push from a fresh trusted repository
        env:
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir /tmp/trusted
          git -c credential.helper= -c core.askPass= clone --no-checkout "https://github.com/${GITHUB_REPOSITORY}.git" /tmp/trusted/repo
          cd /tmp/trusted/repo
          git checkout "${{ github.event.pull_request.head.sha }}"
          git config user.name "Ausculta Control Plane"
          git config user.email "control-plane@users.noreply.github.com"
          cd "$GITHUB_WORKSPACE"
          while IFS= read -r line; do
            path="${line:3}"; path="${path##* -> }"
            mkdir -p "/tmp/trusted/repo/$(dirname "$path")"
            if [[ -e "$path" ]]; then cp -a "$path" "/tmp/trusted/repo/$path"; else rm -f "/tmp/trusted/repo/$path"; fi
          done <<< "$(git status --porcelain)"
          cd /tmp/trusted/repo
          rm -f .github/workflows/acp002-second-p1-repair.yml
          git add control-plane .github/workflows/control-plane-writer.yml .github/workflows/acp002-freeze-and-judge.yml 2>/dev/null || true
          git diff --cached --check
          git commit -m "control-plane: repair second ACP-002 blocking P1 set"
          git -c credential.helper= -c core.askPass= -c http.extraheader="AUTHORIZATION: bearer ${PUSH_TOKEN}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${REPAIR_BRANCH}"
          echo "REPAIRED_SHA=$(git rev-parse HEAD)"
