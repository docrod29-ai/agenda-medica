name: GP6 GP9 GP12 bounded repair

on:
  push:
    branches: [product/consultorio-core-001]
    paths:
      - .github/workflows/gp6-gp9-gp12-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: product/consultorio-core-001
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply and prove GP6 GP9 GP12
        run: bash scripts/gp6-gp9-gp12-repair.sh
