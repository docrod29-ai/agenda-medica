# ACP-002 — Cloud writer runner
#
# One bounded writer task, in GitHub Actions, with least privilege and no
# production access.
#
# What makes this different from the ACP-001 bootstrap it replaces:
#
#   - It is not hardcoded to one item. The item comes from the board's own
#     deterministic selection, and the runner refuses to write anything else.
#   - The preflight is `control-plane/preflight.mjs`, which is unit tested with
#     reverse proofs, instead of bash pasted into a step. Fourteen BASELINE.md
#     conditions, one machine-readable answer, one exact stop condition.
#   - The permissions handed to the preflight are PARSED OUT OF THIS FILE rather
#     than typed twice. A future edit that widens the token is therefore checked
#     against the allowlist instead of quietly disagreeing with a comment.
#   - Nothing auto-fires a writer: the `writer` job runs on `workflow_dispatch`
#     and on nothing else.
#
# It cannot deploy to production and it cannot merge to main: it holds no
# deployment scope, and the preflight refuses any target branch other than the
# one the board declares — never `main` or `master`.
#
# THE ATTESTATION JOB, and why the trigger list is not just `workflow_dispatch`.
#
# The first version of this file was dispatch-only, and that made it unrunnable.
# GitHub exposes `workflow_dispatch` only for workflow files present on the
# DEFAULT branch, and no control-plane workflow has ever been on `main` — not
# the ACP-001 bootstrap, not the Codex judge. Both of those use `pull_request`,
# and that is not an accident or a shortcut: before a workflow reaches the
# default branch, `pull_request` is the only trigger it can have. A runner that
# cannot run until someone performs a forbidden merge has not been delivered.
#
# So a second job runs on `pull_request` to attest the harness — and it is a
# strictly READ-ONLY job. It proves the preflight and the focused suite execute
# entirely in GitHub Actions and that the preflight refuses a bad request. It
# never installs the Claude CLI, never invokes a writer, and never pushes.
# Attesting a writer must not require running one.

name: Control Plane Writer

on:
  workflow_dispatch:
    inputs:
      item_id:
        description: 'Board item the writer is authorized to work on (must match the board selection, e.g. ACP-003)'
        required: true
        type: string
      expected_sha:
        description: 'Full 40-character SHA the writer must run against'
        required: true
        type: string
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-writer.yml'

# One writer at a time, and never cancel one mid-flight: a half-written
# checkpoint is worse than a slow queue.
concurrency:
  group: ausculta-control-plane-writer
  cancel-in-progress: false

jobs:
  writer:
    # A writer starts only when a human dispatches it. `pull_request` reaches
    # this file now, and must never reach this job.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # LEAST PRIVILEGE. `contents: write` is the only write scope, because the
    # writer's whole product is a pushed checkpoint. Every production-reaching
    # scope is disclaimed explicitly rather than left to the default, so the
    # preflight can read this block back and prove it.
    permissions:
      contents: write
      pull-requests: none
      issues: none
      actions: none
      deployments: none
      id-token: none
      packages: none
    env:
      # Single source of truth for the budget: fed to the preflight AND to the
      # CLI below, so an unbounded run cannot be authorized by one and started
      # by the other.
      WRITER_MAX_TURNS: '60'
      WRITER_TIMEOUT_MINUTES: '60'
      WRITER_MAX_RETRIES: '0'
      ITEM_ID: ${{ inputs.item_id }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout the exact authorized SHA
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          # REPAIR/ACP-002/P1-2. This used to persist the contents:write
          # credential into .git/config for the whole job, while the writer held
          # Bash(node|npm|npx) — which reaches git through a child process. The
          # branch and scope fences ran AFTER the writer, so a writer that
          # wanted to could have pushed anything anywhere before they ever ran.
          # The credential now exists only inside the final push step.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve the target branch the board declares
        id: target
        shell: bash
        run: |
          set -euo pipefail
          branch="$(node -p "JSON.parse(require('fs').readFileSync('control-plane/MASTER_BOARD.json','utf8')).source_branch")"
          if [[ -z "$branch" || "$branch" == "main" || "$branch" == "master" || "$branch" == "undefined" ]]; then
            echo "::error::FORBIDDEN_TARGET_BRANCH: $branch"
            exit 90
          fi
          # The authorized SHA must actually be on that branch; a writer must not
          # be pointed at a commit from somewhere else.
          git fetch origin "$branch"
          if ! git merge-base --is-ancestor "$EXPECTED_SHA" "origin/$branch"; then
            echo "::error::AUTHORIZED_SHA_NOT_ON_TARGET_BRANCH: $EXPECTED_SHA is not an ancestor of origin/$branch"
            exit 91
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Build the preflight request
        id: request
        env:
          # Presence only. The value is never written to a file, an output, or a
          # log — the preflight refuses a request that carries one.
          ANTHROPIC_SECRET_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          WORKTREE_CLEAN=true
          if [[ -n "$(git status --porcelain)" ]]; then WORKTREE_CLEAN=false; fi
          export WORKTREE_CLEAN

          # Read this workflow's OWN permissions block instead of retyping it.
          # Two hand-maintained copies of a permission list drift, and the copy
          # that drifts is always the one being checked.
          node --input-type=module <<'NODE' > /tmp/acp-preflight-request.json
          import { readFileSync } from 'node:fs'
          import { readdirSync } from 'node:fs'
          import { writerPermissionsFromWorkflow } from './control-plane/preflight.mjs'
          const permissions = writerPermissionsFromWorkflow(
            readFileSync('.github/workflows/control-plane-writer.yml', 'utf8'),
          )
          // Every committed judge workflow, handed to condition 11 for real
          // inspection. If none is found the condition fails closed.
          const judgeWorkflows = readdirSync('.github/workflows')
            .filter((name) => /judge/.test(name))
            .sort()
            .map((name) => ({
              path: `.github/workflows/${name}`,
              job: 'codex-judge',
              source: readFileSync(`.github/workflows/${name}`, 'utf8'),
            }))

          const request = {
            item_id: process.env.ITEM_ID,
            holder: 'CLAUDE_OPUS',
            run_id: `${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`,
            branch: process.env.TARGET_BRANCH,
            expected_sha: process.env.EXPECTED_SHA,
            head_sha: process.env.GITHUB_SHA,
            worktree_clean: process.env.WORKTREE_CLEAN === 'true',
            secret_name: 'ANTHROPIC_API_KEY',
            secret_present: process.env.ANTHROPIC_SECRET_PRESENT === 'true',
            budget: {
              max_turns: Number(process.env.WRITER_MAX_TURNS),
              timeout_minutes: Number(process.env.WRITER_TIMEOUT_MINUTES),
              max_retries: Number(process.env.WRITER_MAX_RETRIES),
            },
            // REPAIR/ACP-002/P1-4. The real attempt number, so the retry
            // ceiling is spent against something instead of merely declared.
            // With max_retries 0, attempt 2 refuses before Claude is installed.
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
            // REPAIR/ACP-002/P1-5. The committed judge workflows, so condition
            // 11 can inspect real permissions instead of a board flag.
            judge_workflows: judgeWorkflows,
            permissions,
          }
          process.stdout.write(JSON.stringify(request, null, 2))
          NODE

      - name: Fail closed on the fourteen BASELINE preflight conditions
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node control-plane/preflight.mjs --request /tmp/acp-preflight-request.json | tee /tmp/acp-preflight-result.json
          preflight_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$preflight_rc" -ne 0 ]]; then
            stop="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/acp-preflight-result.json','utf8')).stop_condition")"
            echo "::error::PREFLIGHT_STOP_CONDITION: $stop"
            echo "The program transitions to BLOCKED. It does not guess, weaken policy, or continue."
            exit "$preflight_rc"
          fi
          authorized="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/acp-preflight-result.json','utf8')).authorized.item_id")"
          echo "authorized_item=$authorized" >> "$GITHUB_OUTPUT"
          # Snapshot the board BEFORE the writer touches anything, outside the
          # working tree, so the scope guard compares against something the
          # writer could not have edited.
          cp control-plane/MASTER_BOARD.json /tmp/acp-board-before.json

      - name: Install Claude Code CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run exactly one bounded Claude/Opus writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AUTHORIZED_ITEM: ${{ steps.preflight.outputs.authorized_item }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail

          # The task text is the board's own `next_action` for the authorized
          # item. The runner does not invent work, and it cannot be pointed at a
          # different item than the one the preflight authorized.
          node --input-type=module <<'NODE' > /tmp/acp-task.txt
          import { readFileSync } from 'node:fs'
          const board = JSON.parse(readFileSync('control-plane/MASTER_BOARD.json', 'utf8'))
          const item = board.items.find((entry) => entry.id === process.env.AUTHORIZED_ITEM)
          if (!item) throw new Error(`AUTHORIZED_ITEM_MISSING_FROM_BOARD: ${process.env.AUTHORIZED_ITEM}`)
          process.stdout.write(`${item.id} — ${item.title}\n\n${item.next_action}\n`)
          NODE

          cat > /tmp/acp-prompt.txt <<PROMPT
          AUSCULTA-AUTONOMOUS-CONTROL-PLANE-001
          WORK ITEM: $(cat /tmp/acp-task.txt)

          You are the ONE WRITER, and the control plane has already proved you are
          the only one: the board selected this item deterministically and the
          preflight granted the writer lock for it.

          READ FIRST, completely: CLAUDE.md, AGENTS.md, control-plane/BASELINE.md,
          control-plane/MASTER_BOARD.json, control-plane/MASTER_BOARD.schema.json,
          control-plane/kernel.mjs, control-plane/preflight.mjs.

          BOUNDARIES — these are enforced after you finish, not merely requested:
          - Work only on ${AUTHORIZED_ITEM}. Do not start the next item.
          - Change only files under control-plane/. Anything else fails the run.
          - Do not touch product code, clinical code, Firestore rules, or deployment.
          - Do not merge, do not deploy, do not rotate secrets, do not use PHI.
          - Do not commit or push. The workflow verifies, commits and pushes.
          - Do not weaken a guard or delete a test to get green.

          Run \`node --test control-plane/*.test.mjs\` and
          \`node control-plane/kernel.mjs check\` yourself before you finish.

          Update control-plane/MASTER_BOARD.json truthfully to WRITER_DONE with
          concise evidence if and only if the work is genuinely complete and the
          focused verification passes. Never mark JUDGE_PASS or CLOSED: closure
          belongs to the independent judge.

          Final response: what changed, what you proved, and
          READY_FOR_INDEPENDENT_REVIEW=YES/NO.
          PROMPT

          # REPAIR/ACP-002/P1-2. No shell for the writer. `Bash(node:*)` and
          # friends look narrow, but node can spawn git, and npm/npx can run
          # arbitrary package scripts — so the allowlist was decorative and the
          # writer could have reached git before any fence ran. Editing tools
          # only. Verification and the push happen in their own steps below,
          # where the writer has no say.
          set +e
          claude -p "$(cat /tmp/acp-prompt.txt)" \
            --model opus \
            --max-turns "$WRITER_MAX_TURNS" \
            --output-format json \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" "WebSearch" "WebFetch" \
            2>&1 | tee /tmp/acp-writer.log
          claude_rc=${PIPESTATUS[0]}
          set -e

          if [[ "$claude_rc" -ne 0 ]]; then
            echo "::error::CLAUDE_WRITER_EXIT_${claude_rc}"
            tail -n 200 /tmp/acp-writer.log || true
            exit "$claude_rc"
          fi

      - name: Enforce item-scoped writer authorization
        env:
          AUTHORIZED_ITEM: ${{ steps.preflight.outputs.authorized_item }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [[ -z "$status" ]]; then
            echo "::error::WRITER_PRODUCED_NO_DELTA"
            exit 79
          fi
          printf '%s\n' "$status"
          # Porcelain paths, renames resolved to their destination.
          git status --porcelain | sed 's/^...//' | sed 's/^.* -> //' > /tmp/acp-changed.txt
          cat /tmp/acp-changed.txt

          # REPAIR/ACP-002/P1-3. "Everything is under control-plane/" was the
          # only thing the old check proved, which let a writer authorized for
          # one item rewrite another item's record or drop in its
          # implementation. Authorization is per item now, declared up front in
          # item-scopes.json, and the board diff must touch only this item.
          set +e
          node control-plane/scope-guard.mjs \
            --item "$AUTHORIZED_ITEM" \
            --before /tmp/acp-board-before.json \
            --changed /tmp/acp-changed.txt | tee /tmp/acp-scope.json
          scope_rc=${PIPESTATUS[0]}
          set -e
          if [[ "$scope_rc" -ne 0 ]]; then
            first="$(node -p "JSON.parse(require('fs').readFileSync('/tmp/acp-scope.json','utf8')).github_outputs.first_violation")"
            echo "::error::FORBIDDEN_SCOPE_CHANGE: $first"
            exit 80
          fi

      - name: Verify the focused contract before anything is pushed
        shell: bash
        run: |
          set -euo pipefail
          node --test control-plane/*.test.mjs
          node control-plane/kernel.mjs check

      # REPAIR/ACP-002/P1-2. The ONLY step that sees a GitHub credential, and it
      # runs after the preflight, the writer, the scope guard and the focused
      # verification have all passed. The token is passed per-invocation with
      # `-c http.extraheader` rather than written into .git/config, so it does
      # not outlive this command, and the destination is pinned to the board's
      # declared branch with main/master refused one last time.
      - name: Commit and push the immutable writer checkpoint
        env:
          AUTHORIZED_ITEM: ${{ steps.preflight.outputs.authorized_item }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          PUSH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$TARGET_BRANCH" == "main" || "$TARGET_BRANCH" == "master" ]]; then
            echo "::error::FORBIDDEN_TARGET_BRANCH: $TARGET_BRANCH"
            exit 92
          fi
          git config user.name "Ausculta Control Plane"
          git config user.email "control-plane@users.noreply.github.com"
          git add control-plane .github/workflows/control-plane-writer.yml
          if git diff --cached --quiet; then
            echo "::error::NO_STAGED_CHANGES_AFTER_SCOPE_VALIDATION"
            exit 81
          fi
          git commit -m "control-plane: ${AUTHORIZED_ITEM} cloud writer checkpoint"
          git -c http.extraheader="AUTHORIZATION: bearer ${PUSH_TOKEN}" \
            push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"
          echo "END_SHA=$(git rev-parse HEAD)"

  # ---------------------------------------------------------------------------
  # ACP-002 attestation — read-only, runs on the pull request, proves the runner
  # harness works in GitHub Actions without running a writer.
  #
  # `contents: read` is the ONLY scope. No secret is referenced, so this job
  # cannot reach a provider even by accident, and there is nothing here that
  # could push.
  # ---------------------------------------------------------------------------
  attest:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout the pull request head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The harness itself runs here, not on anybody's laptop
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node --test control-plane/*.test.mjs
          node control-plane/kernel.mjs check

      - name: The preflight refuses a bad request — fail closed, proved in the cloud
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { BOARD_PATH, SCHEMA_PATH } from './control-plane/kernel.mjs'
          import { STOP_CONDITIONS, runPreflight, writerPermissionsFromWorkflow } from './control-plane/preflight.mjs'

          const board = JSON.parse(readFileSync(BOARD_PATH, 'utf8'))
          const schema = JSON.parse(readFileSync(SCHEMA_PATH, 'utf8'))
          const WORKFLOW = readFileSync('.github/workflows/control-plane-writer.yml', 'utf8')

          // A board on which a writer WOULD be authorized, so the refusals below
          // are caused by the defect under test and not by the board's state.
          const eligible = structuredClone(board)
          for (const item of eligible.items) {
            if (item.id < 'ACP-002') continue
            item.status = item.id === 'ACP-002' ? 'READY' : 'QUEUED'
            item.closed_by = null
            item.blocked_by = (item.dependencies ?? []).filter(
              (id) => eligible.items.find((entry) => entry.id === id)?.status !== 'CLOSED',
            )
          }
          const base = {
            item_id: 'ACP-002',
            holder: 'CLAUDE_OPUS',
            run_id: `${process.env.GITHUB_RUN_ID}-attest`,
            branch: eligible.source_branch,
            expected_sha: 'a'.repeat(40),
            head_sha: 'a'.repeat(40),
            worktree_clean: true,
            secret_name: 'ANTHROPIC_API_KEY',
            secret_present: true,
            budget: { max_turns: 60, timeout_minutes: 60, max_retries: 0 },
            permissions: writerPermissionsFromWorkflow(WORKFLOW),
          }

          // Control: the real declared writer permissions are authorized.
          const clean = runPreflight({ board: eligible, schema, request: base })
          assert.equal(clean.ok, true, `the committed writer permissions must pass: ${JSON.stringify(clean.checks.filter((c) => !c.ok))}`)

          // Each defect must produce its exact stop condition. If any of these is
          // waved through, the runner is not fail-closed and this job fails.
          const defects = [
            ['targets main', { branch: 'main' }, STOP_CONDITIONS.FORBIDDEN_TARGET_BRANCH],
            ['credential absent', { secret_present: false }, STOP_CONDITIONS.MISSING_REQUIRED_SECRET_OR_EXTERNAL_CREDENTIAL],
            ['carries a credential value', { secret_value: 'sk-ant-not-a-real-key' }, STOP_CONDITIONS.SECRET_VALUE_LEAKED],
            ['unbounded budget', { budget: null }, STOP_CONDITIONS.BUDGET_NOT_BOUNDED],
            ['dirty worktree', { worktree_clean: false }, STOP_CONDITIONS.UNCLEAN_WORKTREE_AT_FREEZE],
            ['deployment scope', { permissions: { contents: 'write', deployments: 'write' } }, STOP_CONDITIONS.WRITER_PERMISSIONS_TOO_BROAD],
            ['item the board did not select', { item_id: 'ACP-003' }, STOP_CONDITIONS.ITEM_NOT_AUTHORIZED],
            ['checkout drifted from the authorized SHA', { head_sha: 'b'.repeat(40) }, STOP_CONDITIONS.BRANCH_OR_SHA_NOT_EXPLICIT],
          ]
          for (const [label, override, expected] of defects) {
            const result = runPreflight({ board: eligible, schema, request: { ...base, ...override } })
            assert.equal(result.ok, false, `${label} must be refused`)
            assert.equal(result.next_board_status, 'BLOCKED', `${label} must route the program to BLOCKED`)
            assert.equal(result.authorized, null, `${label} must authorize nothing`)
            const stops = result.checks.filter((c) => !c.ok).map((c) => c.stop_condition)
            assert.ok(stops.includes(expected), `${label}: expected ${expected}, got ${JSON.stringify(stops)}`)
            console.log(`refused: ${label} -> ${expected}`)
          }

          // A drifted production authorization on the board stops the writer too,
          // and it is caught TWICE: the committed schema pins the flag with
          // `const: false`, and the policy invariants check it independently of
          // the schema. So the reported `stop_condition` is BOARD_INVALID (the
          // first failing condition) and the drift shows up alongside it — which
          // is why membership is asserted here rather than first-place.
          const drifted = structuredClone(eligible)
          drifted.execution_policy.production_deploy_authorized = true
          const driftResult = runPreflight({ board: drifted, schema, request: base })
          assert.equal(driftResult.ok, false)
          assert.equal(driftResult.authorized, null)
          const driftStops = driftResult.checks.filter((c) => !c.ok).map((c) => c.stop_condition)
          assert.ok(driftStops.includes(STOP_CONDITIONS.POLICY_AUTHORIZATION_DRIFT), `expected the policy layer to fire, got ${JSON.stringify(driftStops)}`)
          assert.ok(driftStops.includes(STOP_CONDITIONS.BOARD_INVALID), `expected the schema layer to fire, got ${JSON.stringify(driftStops)}`)
          console.log(`refused: board authorizing production deploy -> ${JSON.stringify(driftStops)} (two independent layers)`)
          NODE

      - name: This job holds no write scope, and says so from the file itself
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { writerPermissionsFromWorkflow } from './control-plane/preflight.mjs'

          const WORKFLOW = readFileSync('.github/workflows/control-plane-writer.yml', 'utf8')
          const attest = writerPermissionsFromWorkflow(WORKFLOW, 'attest')
          assert.deepEqual(attest, { contents: 'read' }, `the attestation job must be read-only, found ${JSON.stringify(attest)}`)

          // And the repair must not have widened the writer while it was here.
          const writer = writerPermissionsFromWorkflow(WORKFLOW, 'writer')
          const writes = Object.entries(writer).filter(([, level]) => level === 'write')
          assert.deepEqual(writes, [['contents', 'write']], `the writer job gained a write scope: ${JSON.stringify(writer)}`)
          for (const scope of ['deployments', 'id-token', 'packages']) {
            assert.equal(writer[scope], 'none', `${scope} must stay disclaimed in the writer job`)
          }
          console.log(`attest=${JSON.stringify(attest)} writer=${JSON.stringify(writer)}`)
          NODE

      - name: Record the live preflight decision on real PR state
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/acp-attest-request.json <<JSON
          {
            "item_id": "ACP-002",
            "holder": "CLAUDE_OPUS",
            "run_id": "${GITHUB_RUN_ID}-attest-live",
            "branch": "$(node -p "JSON.parse(require('fs').readFileSync('control-plane/MASTER_BOARD.json','utf8')).source_branch")",
            "expected_sha": "${GITHUB_SHA}",
            "head_sha": "${GITHUB_SHA}",
            "worktree_clean": true,
            "secret_name": "ANTHROPIC_API_KEY",
            "secret_present": false,
            "budget": {"max_turns": 60, "timeout_minutes": 60, "max_retries": 0},
            "permissions": {"contents": "read"}
          }
          JSON
          echo '=== ACP-002_LIVE_PREFLIGHT_BEGIN ==='
          # Exit status is NOT asserted here: this records what the preflight
          # decides about the board as it actually stands. The pass/fail proof
          # is the deterministic suite above.
          node control-plane/preflight.mjs --request /tmp/acp-attest-request.json || true
          echo '=== ACP-002_LIVE_PREFLIGHT_END ==='
