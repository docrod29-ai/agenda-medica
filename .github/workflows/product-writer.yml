name: Ausculta Product Writer

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Existing product branch to update (must start with product/)'
        required: true
        type: string
      expected_sha:
        description: 'Exact current 40-char HEAD of target_branch'
        required: true
        type: string

concurrency:
  group: ausculta-product-writer
  cancel-in-progress: false

jobs:
  writer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TARGET_BRANCH: ${{ inputs.target_branch }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      WRITER_MAX_TURNS: '40'
    steps:
      - name: Validate target
        shell: bash
        run: |
          set -euo pipefail
          case "$TARGET_BRANCH" in
            product/*) ;;
            *) echo "::error::FORBIDDEN_TARGET_BRANCH=$TARGET_BRANCH"; exit 90 ;;
          esac
          if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::INVALID_EXPECTED_SHA"; exit 91
          fi

      - name: Checkout exact product checkpoint
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prove branch tip has not moved
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          tip="$(git rev-parse "origin/$TARGET_BRANCH")"
          if [[ "$tip" != "$EXPECTED_SHA" ]]; then
            echo "::error::SHA_CHANGED expected=$EXPECTED_SHA actual=$tip"
            exit 92
          fi
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::UNCLEAN_WORKTREE_AT_START"
            exit 93
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Anthropic transport
        env:
          ANTHROPIC_SECRET_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANTHROPIC_SECRET_PRESENT" != "true" ]]; then
            echo "::error::MISSING_REQUIRED_SECRET_OR_EXTERNAL_CREDENTIAL: ANTHROPIC_API_KEY"
            exit 94
          fi

      - name: Install Claude Code
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run one bounded Claude Opus product writer
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/product-prompt.txt <<'PROMPT'
          AUSCULTA PRODUCT BOARD issue #296
          ACTIVE SLICE: CONTEXT-CANONICALIZATION
          ROLE: You are the ONE WRITER. Model must be Opus. Do not start later slices.

          READ FIRST: CLAUDE.md, AGENTS.md if present, docs/product/README.md, and the current repository architecture/docs relevant to product truth. Treat accepted V15 SHA 317c6c5695b69e1a543d99d65e897f638db563a8 as the baseline for this product branch.

          MANDATORY DELIVERABLES:
          1. docs/product/CONTEXT_CANONICAL.md
          2. docs/product/PRODUCT_BOARD.md
          3. docs/product/DECISION_REGISTER.md
          4. scripts/product/context-verifier.mjs
          5. focused deterministic tests under tests/product/

          CANONICAL REQUIREMENTS:
          - One clinical truth -> structured facts/encounter model -> multiple document renderers.
          - Absolute NO INVENTAR.
          - Explicit truth states: NEGADO, NO_INTERROGADO, NO_DOCUMENTADO, DESCONOCIDO, INFERIDO, INCIERTO, CONFLICTIVO.
          - Documentation inputs may be dictation, free text, mixed voice+text, abbreviated/disorganized, spelling errors, medical terminology, Spanish/English/Spanglish, without re-dictation.
          - Documentation outputs at minimum: primera vez, evolucion, historia clinica, interconsulta, hospitalaria, UCI, egreso, resumen medico, resumen cronologico, aseguradora, justificacion, referencia, contrarreferencia, instrucciones al paciente, resumen para especialista.
          - Preserve provenance and draft/signed states. Physician corrections may feed preference learning but must not rewrite clinical truth.
          - Work order exactly: CONTEXT-CANONICALIZATION -> DOCUMENTATION ENGINE / CLINICAL TRUTH -> VOICE ENGINE -> CLINICAL REASONING + EVIDENCE + SAFETY -> CONSULTORIO/AGENDA/RECETA/PAGOS/SECRETARIA -> WHATSAPP/PATIENT EXPERIENCE -> HOSPITAL/UCI -> SPECIALTY PACKAGES -> MOBILE FIRST + BRAND/UI -> RELIABILITY/SCALE/OBSERVABILITY/DR/SECURITY/PRODUCTION READINESS -> EVALUATION KERNEL/competitive benchmark.
          - Explicitly classify ACCEPTED, DEFERRED, UNKNOWN, OWNER_APPROVAL_REQUIRED instead of inventing decisions.

          VERIFIER MUST FAIL ON:
          - missing mandatory canonical sections/requirements,
          - contradictory canonical assertions,
          - duplicate active slices,
          - forbidden scope drift or wrong product work order.

          NO GOLD PLATING. Do not refactor unrelated code. Do not touch Control Plane. Do not merge main, deploy, use PHI, alter production secrets, billing/spending, clinical policy, or safety/security gates.

          ALLOWED PATHS ONLY: docs/product/**, scripts/product/**, tests/product/**.
          Do not commit or push. Workflow will verify and push after you finish.

          Final response must state READY_FOR_REVIEW=YES or NO.
          PROMPT

          claude -p "$(cat /tmp/product-prompt.txt)" \
            --model opus \
            --max-turns "$WRITER_MAX_TURNS" \
            --output-format json \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" "WebSearch" "WebFetch"

      - name: Enforce product slice scope
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git status --porcelain)"
          if [[ -z "$changed" ]]; then
            echo "::error::WRITER_PRODUCED_NO_DELTA"; exit 95
          fi
          git status --porcelain | sed 's/^...//' | sed 's/^.* -> //' > /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              docs/product/*|scripts/product/*|tests/product/*) ;;
              *) echo "::error::FORBIDDEN_SCOPE_CHANGE=$path"; exit 96 ;;
            esac
          done < /tmp/changed.txt

      - name: Verify context slice
        shell: bash
        run: |
          set -euo pipefail
          node scripts/product/context-verifier.mjs
          node --test tests/product/*.test.mjs

      - name: Commit and push checkpoint to product branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ausculta-product-writer[bot]"
          git config user.email "ausculta-product-writer[bot]@users.noreply.github.com"
          git add docs/product scripts/product tests/product
          git commit -m "product: canonicalize Ausculta context"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:$TARGET_BRANCH"
