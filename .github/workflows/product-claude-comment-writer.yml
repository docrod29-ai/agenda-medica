name: Ausculta Product Claude Writer

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Product PR number
        required: true
        type: string
      expected_sha:
        description: Exact 40-character product PR head SHA
        required: true
        type: string

concurrency:
  # Serialize writers only inside the same product PR. Independent PRs may run
  # concurrently; Product Board ownership remains the fail-closed overlap guard.
  group: ausculta-product-writer-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  writer:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/ausculta-claude-writer '))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      WRITER_MAX_TURNS: '50'
    steps:
      - name: Resolve and verify exact product PR head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT: ${{ github.event.comment.body }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
          DISPATCH_PR_NUMBER: ${{ inputs.pr_number }}
          DISPATCH_EXPECTED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            expected="$DISPATCH_EXPECTED_SHA"
            pr_number="$DISPATCH_PR_NUMBER"
          else
            expected="$(printf '%s' "$COMMENT" | awk '{print $2}')"
            pr_number="$COMMENT_PR_NUMBER"
          fi
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 90; }
          [[ "$pr_number" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_PR_NUMBER'; exit 89; }
          pr="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          title="$(jq -r '.title' <<<"$pr")"
          body="$(jq -r '.body // ""' <<<"$pr")"
          [[ "$head_ref" == product/* ]] || { echo "::error::NOT_PRODUCT_BRANCH=$head_ref"; exit 91; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo '::error::FORK_NOT_ALLOWED'; exit 92; }
          [[ "$head_sha" == "$expected" ]] || { echo "::error::SHA_CHANGED expected=$expected actual=$head_sha"; exit 93; }
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "branch=$head_ref" >> "$GITHUB_OUTPUT"
          printf '%s' "$title" > /tmp/pr-title.txt
          printf '%s' "$body" > /tmp/pr-body.txt

      - name: Fail closed if Anthropic credential is absent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${ANTHROPIC_API_KEY:-}" ]] || { echo '::error::MISSING_REQUIRED_SECRET_OR_EXTERNAL_CREDENTIAL: ANTHROPIC_API_KEY'; exit 78; }

      - name: Checkout immutable product candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Claude Code
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run one bounded Claude Opus product writer
        id: claude_writer
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/product-prompt.txt <<'PROMPT'
          AUSCULTA PRODUCT BOARD #296 — BOUNDED PRODUCT WRITER.
          You are CLAUDE/OPUS, the ONE WRITER for this exact product PR checkpoint. This PR has its own writer lock, so independent PRs may run concurrently. Never modify files owned by another active/overlapping slice; if safe ownership cannot be established from the Product Board and PR body, stop with BLOCKED_BY_GATE instead of guessing.

          READ FIRST: AGENTS.md, CLAUDE.md, docs/product/CONTEXT_CANONICAL.md, docs/product/PRODUCT_BOARD.md, docs/product/DECISION_REGISTER.md, the PR title/body copied below, the relevant slice contract under docs/product/slices/, and existing implementation/tests in the repository.

          FAST PATH FOR ACTIVE REPAIR DIRECTIVES: if the PR body contains `ACTIVE P1 REPAIR DIRECTIVE`, treat those enumerated blockers as the complete mandatory scope. Read only the minimum relevant implementation/tests/contracts needed to close them, implement focused tests, verify your edits, and stop. Do not spend turns re-auditing unrelated modules or proposing optional refactors.

          NON-NEGOTIABLES:
          - Implement only the slice declared by this PR and the current Product Board; do not start later functional slices.
          - Preserve Clinical Truth, NO INVENTAR, provenance, explicit uncertainty/conflict, signed-note integrity, clinician authority, tenant isolation, and existing safety/security gates.
          - Reuse/consolidate existing primitives before creating parallel systems.
          - NO GOLD PLATING: close mandatory criteria, add focused positive/negative tests, then stop.
          - No main merge, deploy, PHI, production secrets, billing/spending changes, clinical-policy changes, destructive changes, or weakened safety/security gates.
          - If the PR/board explicitly says PREPARED_ONLY or a prerequisite judge is still pending, do not implement blocked functional code; restrict work to independent reversible preparation and say BLOCKED_BY_GATE in the final response.
          - Do not edit workflows, Control Plane, environment/secret files, dependency manifests/lockfiles, Firebase/Firestore security rules, deployment configuration, or production configuration.

          ALLOWED MUTATION AREAS:
          - src/**
          - tests/**
          - e2e/**
          - docs/product/**
          - scripts/product/**
          Everything else is forbidden.

          Do not commit or push. The workflow verifies scope and performs the single checkpoint push.
          Final response must include READY_FOR_REVIEW=YES or READY_FOR_REVIEW=NO and a concise list of tests expected to pass.
          PROMPT
          {
            printf '\nTARGET_BRANCH: %s\nEXPECTED_SHA: %s\nPR TITLE:\n' "$TARGET_BRANCH" "$EXPECTED_SHA"
            cat /tmp/pr-title.txt
            printf '\n\nPR BODY:\n'
            cat /tmp/pr-body.txt
          } >> /tmp/product-prompt.txt

          claude -p "$(cat /tmp/product-prompt.txt)" \
            --model opus \
            --max-turns "$WRITER_MAX_TURNS" \
            --output-format json \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
            --disallowedTools "Bash" "WebSearch" "WebFetch"

      - name: Enforce bounded product scope
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$(git status --porcelain)" ]] || { echo '::error::WRITER_PRODUCED_NO_DELTA'; exit 94; }
          git status --porcelain | sed 's/^...//' | sed 's/^.* -> //' > /tmp/changed.txt
          while IFS= read -r path; do
            case "$path" in
              src/*|tests/*|e2e/*|docs/product/*|scripts/product/*) ;;
              *) echo "::error::FORBIDDEN_SCOPE_CHANGE=$path"; exit 95 ;;
            esac
            case "$path" in
              .github/*|control-plane/*|package.json|package-lock.json|firestore.rules|storage.rules|firebase.json|vercel.json|next.config.*|.env*)
                echo "::error::FORBIDDEN_SENSITIVE_CHANGE=$path"; exit 96 ;;
            esac
          done < /tmp/changed.txt
          git diff --check

      - name: Prove branch tip still has not moved
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$TARGET_BRANCH"
          tip="$(git rev-parse "origin/$TARGET_BRANCH")"
          [[ "$tip" == "$EXPECTED_SHA" ]] || { echo "::error::SHA_CHANGED_DURING_WRITER expected=$EXPECTED_SHA actual=$tip"; exit 97; }

      - name: Persist mandatory product checkpoint
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ausculta-claude-writer[bot]"
          git config user.email "ausculta-claude-writer[bot]@users.noreply.github.com"
          git add src tests e2e docs/product scripts/product
          git commit -m "product: checkpoint bounded active slice"
          checkpoint_sha="$(git rev-parse HEAD)"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:$TARGET_BRANCH"
          echo "sha=$checkpoint_sha" >> "$GITHUB_OUTPUT"

      - name: Verify persisted product checkpoint
        shell: bash
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBUILD-ONLY-PLACEHOLDER-000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
        run: |
          set -euo pipefail
          npx tsc --noEmit
          npx vitest run
          npm run build

      - name: Dispatch canonical CI explicitly
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          CHECKPOINT_SHA: ${{ steps.checkpoint.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The writer's own GITHUB_TOKEN push intentionally does not recursively
          # start PR workflows. Verify the immutable checkpoint is still the branch
          # tip, then use workflow_dispatch, which GitHub explicitly permits.
          actual="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/branches/${TARGET_BRANCH}" | jq -r '.commit.sha')"
          [[ "$actual" == "$CHECKPOINT_SHA" ]] || { echo "::error::CHECKPOINT_MOVED expected=$CHECKPOINT_SHA actual=$actual"; exit 99; }
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "$(jq -nc --arg ref "$TARGET_BRANCH" '{ref:$ref}')"

      - name: Report Claude failure after checkpoint
        if: steps.claude_writer.outcome == 'failure'
        env:
          CHECKPOINT_SHA: ${{ steps.checkpoint.outputs.sha }}
        shell: bash
        run: |
          echo "::error::CLAUDE_EXITED_NONZERO_AFTER_PERSISTED_CHECKPOINT=$CHECKPOINT_SHA"
          exit 98
