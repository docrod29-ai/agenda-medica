name: Control Plane Bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - 'control-plane/**'
      - '.github/workflows/control-plane-bootstrap.yml'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ausculta-control-plane-bootstrap
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: read
  actions: read

jobs:
  acp001-writer:
    if: github.event.pull_request.head.ref == 'control-plane/autonomous-001'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: One-shot ACP-001 writer gate
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          subject="$(git log -1 --pretty=%s)"
          mode="none"
          if [[ "$subject" == "control-plane: run ACP-001 cloud writer (direct CLI)" ]]; then
            mode="initial"
          elif [[ "$subject" == "control-plane: run ACP-001 repair writer" ]]; then
            mode="repair"
          fi

          if [[ "$mode" == "none" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "ACP-001 writer not requested by this commit; exiting without invoking Claude."
            exit 0
          fi

          MODE="$mode" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const board = JSON.parse(readFileSync('control-plane/MASTER_BOARD.json', 'utf8'))
          const item = board.items.find((x) => x.id === 'ACP-001')
          const next = board.items.find((x) => x.id === 'ACP-002')
          const mode = process.env.MODE
          const expected = mode === 'repair' ? 'RUNNING_WRITER' : 'READY'
          if (!item || item.status !== expected) {
            console.error(`::error::ACP-001 ${mode} writer requires ${expected}; got ${item?.status ?? 'MISSING'}`)
            process.exit(82)
          }
          if (!next || next.status !== 'QUEUED') {
            console.error(`::error::ACP-002 must remain QUEUED; got ${next?.status ?? 'MISSING'}`)
            process.exit(83)
          }
          if (board.execution_policy?.max_active_writers !== 1 ||
              board.execution_policy?.production_deploy_authorized !== false ||
              board.execution_policy?.main_merge_authorized !== false ||
              board.execution_policy?.phi_allowed !== false ||
              board.execution_policy?.destructive_changes_authorized !== false ||
              board.execution_policy?.clinical_policy_changes_authorized !== false) {
            console.error('::error::ACP-001 writer governance is not fail-closed')
            process.exit(84)
          }
          if (mode === 'repair') {
            const required = [
              'Structured Codex verdict on frozen SHA 0e6469e2a22b9398c0103fd5e52ac59406fddfe3: FAIL.',
              'Blocking P1: unsupported schema constraints can be silently skipped',
              'Blocking P1: RUNNING_JUDGE -> JUDGE_PASS can be accepted without explicit judge verdict evidence.',
              'Blocking P1: reverse/mutation proof omits the single-active-program guard.'
            ]
            for (const token of required) {
              if (!item.evidence.some((e) => typeof e === 'string' && e.includes(token))) {
                console.error(`::error::Missing repair evidence: ${token}`)
                process.exit(85)
              }
            }
          }
          NODE

          echo "run=true" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Fail closed if Anthropic credential is absent
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANTHROPIC_API_KEY:-}" ]]; then
            echo "::error::MISSING_REQUIRED_SECRET_OR_EXTERNAL_CREDENTIAL: ANTHROPIC_API_KEY"
            exit 78
          fi

      - name: Install Claude Code CLI
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run Claude/Opus as the single ACP-001 writer
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WRITER_MODE: ${{ steps.gate.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$WRITER_MODE" == "repair" ]]; then
            cat > /tmp/acp001-prompt.txt <<'PROMPT'
          AUSCULTA-AUTONOMOUS-CONTROL-PLANE-001
          WORK ITEM: ACP-001 — BOUNDED REPAIR AFTER INDEPENDENT CODEX FAIL.

          You are the ONE WRITER. This is a repair of ACP-001 only.
          Work only in the current checkout of existing branch `control-plane/autonomous-001`
          and existing draft PR #293. Do not create another branch or PR.
          Do not merge. Do not deploy. Do not start ACP-002.

          READ FIRST, completely:
          - CLAUDE.md
          - AGENTS.md
          - control-plane/BASELINE.md
          - control-plane/MASTER_BOARD.json
          - control-plane/MASTER_BOARD.schema.json
          - control-plane/kernel.mjs
          - control-plane/kernel.test.mjs

          The clean independent Codex audit of immutable SHA
          0e6469e2a22b9398c0103fd5e52ac59406fddfe3 returned FAIL.
          Repair EXACTLY these three blocking P1 findings:

          P1-1 — Unsupported schema constraints can be silently skipped.
          Evidence: schema traversal currently only visits constraints represented by the
          current data value. A schema containing a future/absent property with an unsupported
          constraint such as `maximum` can be accepted without detecting the unsupported
          keyword. Make committed-schema validation fail closed for unsupported constraints
          anywhere relevant in the schema, independent of whether the corresponding property
          exists in the current board value. Add direct negative tests reproducing the Codex
          counterexample and nearby empty-array / unused-additionalProperties cases as appropriate.
          Do not broaden into a general schema-engine rewrite beyond what is needed for a
          deterministic fail-closed ACP-001 contract.

          P1-2 — JUDGE_PASS is accepted without a judge verdict.
          Evidence: evaluateTransition('RUNNING_JUDGE','JUDGE_PASS',{}) returned ok=true.
          Require explicit machine-readable PASS verdict evidence for RUNNING_JUDGE -> JUDGE_PASS.
          Missing verdict, FAIL, or UNVERIFIABLE must not pass. Preserve UNVERIFIABLE != PASS.
          Add direct positive and negative tests.

          P1-3 — Reverse proof omits the active-program guard.
          Add a real reverse/mutation proof for the exactly-one-active-program guard so the
          focused suite would fail if that guard were removed or inverted. Keep the existing
          direct two-program negative test as well.

          REQUIRED:
          - Preserve all previously passing ACP-001 invariants.
          - Keep one active program and at most one active writer.
          - Preserve deterministic next-item selection and explicit transition rejection.
          - Keep production deploy, main merge, PHI, destructive changes, and clinical-policy
            changes fail-closed.
          - Legacy agent-state files remain non-authoritative.
          - P2/P3 findings do not auto-create repair loops.
          - Do not add dependencies unless absolutely unavoidable; prefer no new dependency.
          - Do not touch product/clinical code or deployment behavior.
          - Do not change `.github/**`.
          - Do not recreate, execute, or benchmark the pre-repair SHA during this writer run; Codex already established the counterexamples. Spend the bounded run only on the current repair, current focused tests, and canonical-board check.

          ALLOWED REPAIR FILES:
          - control-plane/kernel.mjs
          - control-plane/kernel.test.mjs
          - control-plane/MASTER_BOARD.schema.json only if the repair genuinely requires it
          - control-plane/MASTER_BOARD.json for truthful state/evidence only

          Run:
          - node --test control-plane/*.test.mjs
          - node control-plane/kernel.mjs check

          The board starts this run at RUNNING_WRITER. If and only if the three P1s are repaired
          and focused verification passes, update ACP-001 truthfully to WRITER_DONE and record
          concise repair evidence. DO NOT mark JUDGE_PASS or CLOSED. Do not alter ACP-002.

          IMPORTANT: do NOT commit or push. The workflow will scope-check, verify, commit, and
          push after you finish. Leave only intended working-tree changes.

          Final response: summarize the three repairs, exact tests added, focused test result,
          canonical-board check, and READY_FOR_INDEPENDENT_REVIEW=YES/NO.
          PROMPT
          else
            cat > /tmp/acp001-prompt.txt <<'PROMPT'
          AUSCULTA-AUTONOMOUS-CONTROL-PLANE-001
          WORK ITEM: ACP-001 — Executable state contract and validator.

          You are the ONE WRITER. Work only in the current checkout of existing branch
          `control-plane/autonomous-001` and existing draft PR #293.
          Do not create another branch or PR. Do not merge. Do not deploy.
          Do not start ACP-002.

          READ FIRST, completely:
          - CLAUDE.md
          - AGENTS.md
          - control-plane/BASELINE.md
          - control-plane/MASTER_BOARD.json
          - control-plane/MASTER_BOARD.schema.json

          IMPLEMENT ONLY ACP-001:
          1. Parse and validate MASTER_BOARD.json using the committed schema as authority.
          2. Enforce exactly one active program and at most one active writer.
          3. Deterministically compute the single next eligible item from dependencies.
          4. Enforce an explicit transition table; reject skips and illegal transitions.
          5. Enforce fail-closed policy invariants: production deploy false, main merge false,
             PHI false, destructive false, clinical-policy changes false unless an explicit
             OWNER_APPROVAL_REQUIRED state exists.
          6. Implement lock semantics preventing two writer claims.
          7. UNVERIFIABLE must never become PASS. P2/P3 must never automatically create a
             repair loop.
          8. Emit machine-readable output suitable for later GitHub Actions orchestration.
          9. Add focused tests for happy path, illegal transition, two writers, dependency
             violation, stale legacy-authority attempt, production/main authorization drift,
             and UNVERIFIABLE promotion attempt.
          10. Include reverse/mutation proof for each central guard through tests that would
              fail if the guard were removed or inverted.

          Keep the implementation explicit and small. Prefer `control-plane/kernel.mjs` and
          `control-plane/kernel.test.mjs`; if you need one direct validation dependency, add
          only the minimal dependency to package.json/package-lock.json and explain why.
          `node --test control-plane/*.test.mjs` must run the focused suite.
          `node control-plane/kernel.mjs check` must validate the canonical board and emit
          machine-readable JSON with success/failure and the deterministic next item.

          Do not touch clinical product code, Firestore rules, deployment logic, V16,
          Hardening, provider integrations, or any file outside `control-plane/**`,
          `package.json`, and `package-lock.json`.

          Run the focused tests and canonical-board check yourself. Update MASTER_BOARD.json
          truthfully to show ACP-001 writer completion, but DO NOT mark ACP-001 CLOSED:
          closure requires the independent Codex judge. Use WRITER_DONE or SHA_FROZEN only
          if consistent with your implemented transition contract.

          IMPORTANT: do NOT commit or push. The workflow will scope-check, test, commit, and
          push your changes after you finish. Leave only the intended working-tree changes.

          In your final response report what you changed, invariants, tests, reverse proof,
          and READY_FOR_INDEPENDENT_REVIEW=YES/NO. Do not start ACP-002.
          PROMPT
          fi

          set +e
          claude -p "$(cat /tmp/acp001-prompt.txt)" \
            --model opus \
            --max-turns 60 \
            --output-format json \
            --allowedTools "Read" "Write" "Edit" "Glob" "Grep" \
              "Bash(npm:*)" "Bash(npx:*)" "Bash(node:*)" \
              "Bash(git status:*)" "Bash(git diff:*)" "Bash(git log:*)" \
              "Bash(git rev-parse:*)" \
            --disallowedTools "WebSearch" "WebFetch" \
            2>&1 | tee /tmp/acp001-result.log
          claude_rc=${PIPESTATUS[0]}
          set -e

          if [[ "$claude_rc" -ne 0 ]]; then
            echo "::error::CLAUDE_WRITER_EXIT_${claude_rc}"
            echo "--- Claude diagnostic tail ---"
            tail -n 200 /tmp/acp001-result.log || true
            exit "$claude_rc"
          fi

      - name: Enforce writer scope and require a real delta
        if: steps.gate.outputs.run == 'true'
        env:
          WRITER_MODE: ${{ steps.gate.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          status="$(git status --porcelain)"
          if [[ -z "$status" ]]; then
            echo "::error::ACP-001 writer produced no repository delta"
            exit 79
          fi
          printf '%s\n' "$status"
          while IFS= read -r line; do
            path="${line:3}"
            if [[ "$WRITER_MODE" == "repair" ]]; then
              case "$path" in
                control-plane/kernel.mjs|control-plane/kernel.test.mjs|control-plane/MASTER_BOARD.json|control-plane/MASTER_BOARD.schema.json) ;;
                *)
                  echo "::error::FORBIDDEN_REPAIR_SCOPE_CHANGE: $path"
                  exit 80
                  ;;
              esac
            else
              case "$path" in
                control-plane/*|package.json|package-lock.json) ;;
                *)
                  echo "::error::FORBIDDEN_SCOPE_CHANGE: $path"
                  exit 80
                  ;;
              esac
            fi
          done <<< "$status"

      - name: Verify ACP-001 focused contract
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node --test control-plane/*.test.mjs
          node control-plane/kernel.mjs check

      - name: Commit and push ACP-001 immutable writer checkpoint
        if: steps.gate.outputs.run == 'true'
        env:
          WRITER_MODE: ${{ steps.gate.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Ausculta Control Plane"
          git config user.email "control-plane@users.noreply.github.com"
          if [[ "$WRITER_MODE" == "repair" ]]; then
            git add control-plane/kernel.mjs control-plane/kernel.test.mjs \
              control-plane/MASTER_BOARD.json control-plane/MASTER_BOARD.schema.json 2>/dev/null || true
            commit_message="control-plane: repair ACP-001 Codex P1s"
          else
            git add control-plane package.json package-lock.json 2>/dev/null || true
            commit_message="control-plane: implement ACP-001 state kernel"
          fi
          if git diff --cached --quiet; then
            echo "::error::No staged ACP-001 changes after scope validation"
            exit 81
          fi
          git commit -m "$commit_message"
          git push origin HEAD:control-plane/autonomous-001
          echo "END_SHA=$(git rev-parse HEAD)"
