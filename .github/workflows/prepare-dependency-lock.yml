name: Preparar lock de dependencias
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-dependency-lock.yml'
permissions:
  contents: read
jobs:
  candidato:
    if: github.head_ref == 'codex/ausculta-visual-safety'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Herramienta temporal de recuperación del entorno local. Produce un
      # candidato revisable; nunca escribe en el repositorio ni despliega.
      - name: Preparar las correcciones compatibles
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const p = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          p.devDependencies.vitest = '^4.1.11'
          p.devDependencies['@vitest/coverage-v8'] = '^4.1.11'
          p.overrides = { ...p.overrides, qs: '^6.16.0',
            'google-gax': { uuid: '^11.1.1' },
            'teeny-request': { uuid: '^11.1.1' },
            gaxios: { uuid: '^11.1.1' } }
          fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n')
          JS
          npm install --package-lock-only --ignore-scripts --no-audit --fund=false
          npm update dompurify baseline-browser-mapping qs @google-cloud/firestore @google-cloud/storage google-gax teeny-request retry-request gaxios browserslist fast-uri js-yaml hono morgan vitest @vitest/coverage-v8 @opentelemetry/core stream-json csv-parse --package-lock-only --ignore-scripts --no-audit --fund=false
      - name: Exportar el candidato con huellas Git
        run: |
          node <<'JS'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          for (const path of ['package.json', 'package-lock.json']) {
            const bytes = fs.readFileSync(path)
            const hash = crypto.createHash('sha1').update(Buffer.concat([Buffer.from('blob ' + bytes.length + '\0'), bytes])).digest('hex')
            console.log('CANDIDATE:' + path + ':SHA:' + hash)
            const data = bytes.toString('base64')
            for (let i = 0; i < data.length; i += 12000)
              console.log('CANDIDATE:' + path + ':CHUNK:' + data.slice(i, i + 12000))
          }
          JS
      - name: Instalar y comprobar consumidores de UUID
        run: |
          npm ci --ignore-scripts --no-audit --fund=false
          node <<'JS'
          const assert = require('node:assert/strict')
          const { createRequire } = require('node:module')
          const { createServer } = require('node:http')
          const { Readable } = require('node:stream')
          const { makeUUID } = require('google-gax/build/src/util')
          assert.match(makeUUID(), /^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i)
          for (const parent of ['google-gax', 'gaxios', 'teeny-request']) {
            const scoped = createRequire(require.resolve(parent))
            const uuid = scoped('uuid')
            assert(uuid.validate(uuid.v4()), parent)
          }
          const { Gaxios } = require('gaxios')
          const { teenyRequest } = require('teeny-request')
          const bodies = []
          const server = createServer(async (req, res) => {
            const parts = []
            for await (const p of req) parts.push(p)
            bodies.push({ type: req.headers['content-type'], body: Buffer.concat(parts).toString() })
            res.setHeader('Content-Type', 'application/json')
            res.end('{"ok":true}')
          })
          const timer = setTimeout(() => { console.error('Multipart local agotó 15 segundos'); process.exit(1) }, 15000)
          server.listen(0, '127.0.0.1', async () => {
            try {
              const url = 'http://127.0.0.1:' + server.address().port
              await new Gaxios().request({ url, method: 'POST', multipart: [{ headers: { 'Content-Type': 'text/plain' }, content: 'synthetic-gaxios' }] })
              await new Promise((resolve, reject) => teenyRequest({
                uri: url, method: 'POST',
                multipart: [{ 'Content-Type': 'application/json', body: '{"qa":"synthetic"}' }, { body: Readable.from('synthetic-teeny') }],
              }, (error, response) => error ? reject(error) : (response.statusCode === 200 ? resolve() : reject(new Error(String(response.statusCode))))))
              assert.equal(bodies.length, 2)
              for (const b of bodies) {
                assert.match(b.type, /multipart/)
                assert.match(b.body, /synthetic/)
              }
              console.log('UUID + multipart Gaxios + multipart teeny-request: OK (sólo localhost)')
            } catch (e) { console.error(e); process.exitCode = 1 }
            finally { clearTimeout(timer); server.close() }
          })
          JS
      - name: Auditar producción
        run: npm audit --omit=dev
      - name: Auditar también desarrollo
        run: npm audit
