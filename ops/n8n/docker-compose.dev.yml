services:
  n8n:
    image: n8nio/n8n:2.33.3
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?required}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:?required}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:?required}
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      TZ: ${TZ:-America/Chihuahua}
      GENERIC_TIMEZONE: ${TZ:-America/Chihuahua}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.ssh"]'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
      DB_SQLITE_POOL_SIZE: 2
      AUSCULTA_GITHUB_WEBHOOK_SECRET: ${AUSCULTA_GITHUB_WEBHOOK_SECRET:?required}
      AUSCULTA_GITHUB_TOKEN: ${AUSCULTA_GITHUB_TOKEN:?required}
    volumes:
      - n8n_data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  n8n_data:
