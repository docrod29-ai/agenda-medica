name: Ausculta Product Codex Verdict Recovery

on:
  issue_comment:
    types: [created]

concurrency:
  group: ausculta-product-codex-recover-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  recover:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/ausculta-codex-recover ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Resolve and verify exact product PR head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(printf '%s' "$COMMENT" | awk '{print $2}')"
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 90; }
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          [[ "$head_ref" == product/* ]] || { echo "::error::NOT_PRODUCT_BRANCH=$head_ref"; exit 91; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo '::error::FORK_NOT_ALLOWED'; exit 92; }
          [[ "$head_sha" == "$expected" ]] || { echo "::error::SHA_CHANGED expected=$expected actual=$head_sha"; exit 93; }
          echo "sha=$expected" >> "$GITHUB_OUTPUT"

      - name: Recover immutable verdict artifact without re-auditing
        id: recover
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery
          marker="AUSCULTA_CODEX_FALLBACK_DISPATCHED exact_sha=${EXPECTED_SHA}"
          marker_row="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --paginate --jq '.[] | select(.body | startswith("'"$marker"'")) | [.id,.created_at] | @tsv' | head -n 1 || true)"
          marker_created_at=''
          marker_epoch=''
          if [[ -n "$marker_row" ]]; then
            marker_created_at="${marker_row#*$'\t'}"
            marker_epoch="$(date -u -d "$marker_created_at" +%s 2>/dev/null || true)"
          fi

          exact_dispatch_title="Ausculta-Codex-PR-${PR_NUMBER}-SHA-${EXPECTED_SHA}"
          mapfile -t runs < <(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/product-codex-judge.yml/runs?per_page=100" --jq '.workflow_runs[] | [.id,.status,(.conclusion // ""),.event,.display_title,.created_at] | @tsv')
          checked=0
          candidates=()
          for row in "${runs[@]}"; do
            IFS=$'\t' read -r run_id status conclusion event display_title created_at <<<"$row"
            [[ "$run_id" =~ ^[0-9]+$ ]] || continue
            checked=$((checked + 1))
            rm -rf recovery/artifact recovery/log.txt
            mkdir -p recovery/artifact
            artifact_name="product-codex-verdict-${run_id}"
            if gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "$artifact_name" -D recovery/artifact >/dev/null 2>&1; then
              verdict_file="$(find recovery/artifact -name product-codex-verdict.json -type f | head -n 1 || true)"
              if [[ -n "$verdict_file" ]] && jq -e --arg sha "$EXPECTED_SHA" '.audited_sha == $sha and .independent == true and .read_only == true and (.verdict=="PASS" or .verdict=="FAIL" or .verdict=="UNVERIFIABLE")' "$verdict_file" >/dev/null 2>&1; then
                cp "$verdict_file" recovery/recovered-verdict.json
                echo "source_run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "found=true" >> "$GITHUB_OUTPUT"
                break
              fi
            fi

            exact_candidate=0
            if [[ "$event" == 'workflow_dispatch' && "$display_title" == "$exact_dispatch_title" ]]; then
              exact_candidate=1
            elif [[ "$event" == 'issue_comment' && "$display_title" == *"/ausculta-codex-judge ${EXPECTED_SHA}"* ]]; then
              exact_candidate=1
            elif [[ "$event" == 'workflow_dispatch' && -n "$marker_epoch" ]]; then
              # Legacy fallback runs created before run-name correlation existed are
              # correlated to the marker posted immediately after dispatch.
              run_epoch="$(date -u -d "$created_at" +%s 2>/dev/null || true)"
              if [[ "$run_epoch" =~ ^[0-9]+$ ]] && (( run_epoch >= marker_epoch - 60 && run_epoch <= marker_epoch + 15 )); then
                exact_candidate=1
              fi
            fi

            if [[ "$exact_candidate" == '0' ]]; then
              # Last-resort correlation for legacy issue-comment runs whose default
              # display title carried no SHA. Never require logs for new dispatches.
              if gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log > recovery/log.txt 2>/dev/null && grep -Fq "$EXPECTED_SHA" recovery/log.txt; then
                exact_candidate=1
              fi
            fi

            if [[ "$exact_candidate" == '1' ]]; then
              [[ -n "$conclusion" ]] || conclusion='none'
              candidates+=("${run_id}:${status}:${conclusion}")
            fi
            [[ "$checked" -ge 60 ]] && break
          done
          if [[ ! -f recovery/recovered-verdict.json ]]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' "${candidates[@]:-}" > recovery/candidates.txt
          fi

      - name: Republish validated recovered verdict
        if: steps.recover.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          SOURCE_RUN_ID: ${{ steps.recover.outputs.source_run_id }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -c . recovery/recovered-verdict.json)"
          verdict_name="$(jq -r '.verdict' recovery/recovered-verdict.json)"
          blocking_count="$(jq '[.findings[] | select(.blocking == true and (.severity == "P0" or .severity == "P1"))] | length' recovery/recovered-verdict.json)"
          if [[ "$verdict_name" == "PASS" && "$blocking_count" == "0" ]]; then gate="PASS"; else gate="BLOCKED_SLICE_ONLY"; fi
          printf -v body 'AUSCULTA_CODEX_VERDICT_RECOVERED exact_sha=%s source_run_id=%s recovery_run_id=%s gate=%s\n```json\n%s\n```' "$EXPECTED_SHA" "$SOURCE_RUN_ID" "$GITHUB_RUN_ID" "$gate" "$verdict"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          {
            echo '### Recovered immutable Codex verdict'
            echo "- exact SHA: \`$EXPECTED_SHA\`"
            echo "- source judge run: \`$SOURCE_RUN_ID\`"
            echo "- verdict: **$verdict_name**"
            echo "- gate: **$gate**"
            echo '- No Codex audit was rerun; this workflow only validated and republished an existing immutable artifact.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch one exact-SHA judge after proven miss
        if: steps.recover.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          marker="AUSCULTA_CODEX_FALLBACK_DISPATCHED exact_sha=${EXPECTED_SHA}"
          retry_marker="AUSCULTA_CODEX_FALLBACK_RETRY_DISPATCHED exact_sha=${EXPECTED_SHA}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --paginate --jq '.[] | select(.body | startswith("'"$marker"'")) | .id' | head -n 1 || true)"
          retry_existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --paginate --jq '.[] | select(.body | startswith("'"$retry_marker"'")) | .id' | head -n 1 || true)"

          dispatch_judge() {
            local started run_id
            started="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            gh workflow run product-codex-judge.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER" -f expected_sha="$EXPECTED_SHA"
            run_id=''
            for attempt in 1 2 3 4 5 6; do
              sleep 2
              run_id="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/product-codex-judge.yml/runs?event=workflow_dispatch&per_page=30" --jq '.workflow_runs[] | select(.display_title == "Ausculta-Codex-PR-'"$PR_NUMBER"'-SHA-'"$EXPECTED_SHA"'" and .created_at >= "'"$started"'") | .id' | head -n 1 || true)"
              [[ -n "$run_id" ]] && break
            done
            [[ -n "$run_id" ]] || run_id='pending-correlation'
            printf '%s' "$run_id"
          }

          if [[ -n "$existing" ]]; then
            if [[ -n "$retry_existing" ]]; then
              echo "Fallback retry already recorded for exact SHA; not duplicating. comment_id=$retry_existing"
              exit 0
            fi

            in_flight="$(grep -E '^[0-9]+:(queued|in_progress):' recovery/candidates.txt 2>/dev/null | head -n 1 || true)"
            if [[ -n "$in_flight" ]]; then
              echo "Exact-SHA judge is still queued/in_progress; no duplicate. candidate=$in_flight"
              exit 0
            fi

            failed_candidate="$(grep -E '^[0-9]+:completed:(failure|cancelled)$' recovery/candidates.txt 2>/dev/null | head -n 1 || true)"
            if [[ -z "$failed_candidate" ]]; then
              successful_without_artifact="$(grep -E '^[0-9]+:completed:success$' recovery/candidates.txt 2>/dev/null | head -n 1 || true)"
              if [[ -n "$successful_without_artifact" ]]; then
                echo "::error::JUDGE_SUCCESS_WITHOUT_VALID_VERDICT_ARTIFACT candidate=$successful_without_artifact"
                exit 97
              fi
              echo "Fallback dispatch already recorded and no failed/cancelled exact-SHA candidate proves a retry is warranted. comment_id=$existing"
              exit 0
            fi

            failed_run_id="${failed_candidate%%:*}"
            retry_run_id="$(dispatch_judge)"
            printf -v body '%s recovery_run_id=%s source_failed_run_id=%s judge_run_id=%s\nExactly one bounded retry was launched only after recovery proved no immutable verdict exists and found a failed/cancelled exact-SHA fallback candidate. Further retries on this SHA are blocked by this marker.' "$retry_marker" "$GITHUB_RUN_ID" "$failed_run_id" "$retry_run_id"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
            exit 0
          fi

          judge_run_id="$(dispatch_judge)"
          printf -v body '%s recovery_run_id=%s judge_run_id=%s\nRecovery proved no valid immutable verdict existed, so exactly one explicit workflow_dispatch judge was launched.' "$marker" "$GITHUB_RUN_ID" "$judge_run_id"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null

      - name: Persist recovery miss classification
        if: steps.recover.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          PR_NUMBER: ${{ github.event.issue.number }}
        shell: bash
        run: |
          set -euo pipefail
          candidates="$(paste -sd, recovery/candidates.txt 2>/dev/null || true)"
          [[ -n "$candidates" ]] || candidates='none-visible-in-last-60-runs'
          printf -v body 'AUSCULTA_CODEX_RECOVERY_MISS exact_sha=%s recovery_run_id=%s candidate_runs=%s\nNo valid immutable exact-SHA verdict artifact was found. Exact-SHA run correlation now uses workflow metadata first and legacy marker/log correlation second; in-flight runs are never duplicated.' "$EXPECTED_SHA" "$GITHUB_RUN_ID" "$candidates"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          echo '::warning::NO_VALID_IMMUTABLE_VERDICT_FOUND'
