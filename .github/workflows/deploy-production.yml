# Cierre de PRODUCCIÓN — manual, reutilizando las conexiones que YA existen.
#
# Vercel ya está conectado al repositorio y despliega `main` automáticamente.
# Este workflow NO crea una segunda conexión ni pide tokens de Vercel:
#   1) verifica que el árbol autorizado es el correcto,
#   2) comprueba que Vercel sirve la versión esperada desde el proyecto principal,
#   3) publica firestore.rules (REG-323),
#   4) ejecuta las pruebas contra producción.
#
# Publicar sigue siendo decisión explícita del dueño mediante workflow_dispatch.

name: Despliegue a producción (manual)

on:
  workflow_dispatch:
    inputs:
      sha_esperado:
        description: 'SHA del árbol clínico autorizado para esta publicación'
        required: true
        type: string
      url_produccion:
        description: 'URL canónica de producción'
        required: true
        default: 'https://agenda-medica-one.vercel.app'
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  statuses: read

env:
  SHA_AUTORIZADO: ef0624cb51fd9fc60e9f676b40716b73a77e3475
  VERSION_ESPERADA: nexusmed-v1172
  FIREBASE_PROJECT: nexomed-agenda
  URL_CANONICA: https://agenda-medica-one.vercel.app

jobs:
  produccion:
    name: Cerrar publicación autorizada
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60

    steps:
      - name: Traer el árbol autorizado
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha_esperado }}
          fetch-depth: 0

      - name: 'Compuerta 1 · SHA exacto'
        env:
          SHA_PEDIDO: ${{ inputs.sha_esperado }}
        run: |
          set -euo pipefail
          SHA_REAL="$(git rev-parse HEAD)"
          [ "$SHA_PEDIDO" = "$SHA_AUTORIZADO" ] || {
            echo "::error::El SHA pedido no es el autorizado ($SHA_AUTORIZADO)."
            exit 1
          }
          [ "$SHA_REAL" = "$SHA_AUTORIZADO" ] || {
            echo "::error::El checkout quedó en $SHA_REAL y no en $SHA_AUTORIZADO."
            exit 1
          }
          [ -z "$(git status --porcelain)" ] || {
            echo "::error::El árbol no está limpio."
            exit 1
          }
          echo "Árbol autorizado confirmado: $SHA_REAL"

      - name: 'Compuerta 2 · versión v1172'
        run: |
          set -euo pipefail
          VERSION_TXT="$(tr -d '[:space:]' < public/version.txt)"
          [ "$VERSION_TXT" = "$VERSION_ESPERADA" ] || {
            echo "::error::public/version.txt dice '$VERSION_TXT'; se esperaba '$VERSION_ESPERADA'."
            exit 1
          }
          grep -q "const CACHE = '$VERSION_ESPERADA'" public/sw.js || {
            echo "::error::public/sw.js no declara $VERSION_ESPERADA."
            exit 1
          }
          echo "version.txt y sw.js = $VERSION_ESPERADA"

      - name: 'Compuerta 3 · REG-323 está en firestore.rules'
        run: |
          set -euo pipefail
          grep -q "REG-323" firestore.rules || {
            echo "::error::firestore.rules no contiene REG-323."
            exit 1
          }
          grep -q "request.resource.data.pacienteId == docId" firestore.rules || {
            echo "::error::Falta la guarda pacienteId == docId de REG-323."
            exit 1
          }
          echo "REG-323 presente."

      - name: 'Compuerta 4 · sólo la URL principal'
        env:
          URL_PEDIDA: ${{ inputs.url_produccion }}
        run: |
          set -euo pipefail
          [ "$URL_PEDIDA" = "$URL_CANONICA" ] || {
            echo "::error::La URL pedida es '$URL_PEDIDA'. Este workflow sólo acepta '$URL_CANONICA'."
            exit 1
          }
          echo "URL canónica confirmada: $URL_CANONICA"

      # No usa secretos de Vercel. Lee el status que YA publica la integración
      # GitHub↔Vercel y exige que apunte al proyecto principal agenda-medica.
      - name: 'Compuerta 5 · Vercel apunta a agenda-medica, no agenda-medica-v10'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$SHA_AUTORIZADO/status" \
            > "$RUNNER_TEMP/status.json"

          TARGETS="$(jq -r '.statuses[] | select(.context=="Vercel" and .state=="success") | .target_url // empty' "$RUNNER_TEMP/status.json")"
          echo "$TARGETS" | grep -Fq "/docrod29-ais-projects/agenda-medica/" || {
            echo "::error::No hay un status Vercel SUCCESS del SHA autorizado apuntando al proyecto principal agenda-medica."
            exit 1
          }
          if echo "$TARGETS" | grep -Fq "/agenda-medica-v10/"; then
            echo "::error::El status de Vercel apunta al proyecto agenda-medica-v10. Se detiene."
            exit 1
          fi
          echo "Integración Vercel confirmada: proyecto principal agenda-medica."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El merge a main ya activa el despliegue de Vercel que existe desde antes.
      # Aquí sólo se espera a que el dominio vivo sirva el paquete autorizado.
      - name: 'Vercel · producción ya sirve nexusmed-v1172'
        id: verificar_version
        env:
          URL_PROD: ${{ inputs.url_produccion }}
        run: |
          set -euo pipefail
          for INTENTO in $(seq 1 20); do
            SERVIDO="$(curl -fsS --max-time 20 "$URL_PROD/version.txt" | tr -d '[:space:]' || true)"
            echo "intento $INTENTO: '$SERVIDO'"
            if [ "$SERVIDO" = "$VERSION_ESPERADA" ]; then
              echo "Producción sirve $VERSION_ESPERADA."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Producción no sirve $VERSION_ESPERADA después de 5 minutos. No se tocaron reglas."
          exit 1

      # Acepta la credencial moderna o el token antiguo si el usuario ya tenía
      # uno configurado. No hay que recrear los secretos de Vercel.
      - name: 'Firebase · existe una credencial reutilizable'
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "modo=service-account" >> "$GITHUB_OUTPUT"
            echo "Firebase: se usará FIREBASE_SERVICE_ACCOUNT."
          elif [ -n "${FIREBASE_TOKEN:-}" ]; then
            echo "modo=token" >> "$GITHUB_OUTPUT"
            echo "Firebase: se reutilizará FIREBASE_TOKEN."
          else
            echo "::error::No encuentro una credencial Firebase accesible con nombre FIREBASE_SERVICE_ACCOUNT ni FIREBASE_TOKEN. No se desplegaron reglas."
            exit 1
          fi

      - name: 'Firestore · desplegar REG-323'
        id: firebase_rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          MODO: ${{ steps.firebase_auth.outputs.modo }}
        run: |
          set -euo pipefail
          if [ "$MODO" = "service-account" ]; then
            RUTA_SA="$RUNNER_TEMP/sa-firebase.json"
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUTA_SA"
            chmod 600 "$RUTA_SA"
            export GOOGLE_APPLICATION_CREDENTIALS="$RUTA_SA"
            npx --no-install firebase deploy \
              --only firestore:rules \
              --project "$FIREBASE_PROJECT" \
              --non-interactive
          else
            npx --no-install firebase deploy \
              --only firestore:rules \
              --project "$FIREBASE_PROJECT" \
              --non-interactive \
              --token "$FIREBASE_TOKEN"
          fi

      - name: 'Firebase · borrar credencial temporal'
        if: always()
        run: rm -f "$RUNNER_TEMP/sa-firebase.json" "$RUNNER_TEMP/status.json"

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: 'Seguridad · cabeceras de PRODUCCIÓN'
        id: e2e_seguridad
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.url_produccion }}
        run: npm run e2e:seguridad:prod

      - name: 'Smoke · camino público'
        id: smoke_publico
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.url_produccion }}
        run: npx playwright test --project=chromium e2e/smoke-publico.spec.ts

      - name: 'Smoke · portal rechaza sin enlace'
        id: smoke_portal
        env:
          URL_PROD: ${{ inputs.url_produccion }}
        run: |
          set -euo pipefail
          CODIGO="$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            -X POST -H 'Content-Type: application/json' -d '{}' "$URL_PROD/api/portal")"
          echo "POST /api/portal sin enlace → $CODIGO"
          case "$CODIGO" in
            4*) echo "Portal fail-closed correcto." ;;
            *)  echo "::error::/api/portal respondió $CODIGO sin enlace; se esperaba 4xx."; exit 1 ;;
          esac

      - name: Acta del cierre de producción
        if: always()
        env:
          URL_PROD: ${{ inputs.url_produccion }}
          R_VERSION: ${{ steps.verificar_version.outcome }}
          R_RULES: ${{ steps.firebase_rules.outcome }}
          R_E2E: ${{ steps.e2e_seguridad.outcome }}
          R_SMOKE: ${{ steps.smoke_publico.outcome }}
          R_PORTAL: ${{ steps.smoke_portal.outcome }}
        run: |
          set -euo pipefail
          if [ "$R_VERSION" = "success" ] && [ "$R_RULES" = "success" ] \
            && [ "$R_E2E" = "success" ] && [ "$R_SMOKE" = "success" ] \
            && [ "$R_PORTAL" = "success" ]; then
            RESULTADO="SUCCESS"
          else
            RESULTADO="FAILED"
          fi

          {
            echo "## Acta del cierre de producción"
            echo
            echo '```'
            echo "PRODUCTION_URL=$URL_PROD"
            echo "APP_SHA=$SHA_AUTORIZADO"
            echo "VERSION=$VERSION_ESPERADA"
            echo "VERCEL_EXISTING_INTEGRATION=REUSED"
            echo "VERSION_VERIFICADA=$R_VERSION"
            echo "FIRESTORE_RULES=$R_RULES"
            echo "SECURITY_E2E=$R_E2E"
            echo "SMOKE=$R_SMOKE"
            echo "SMOKE_PORTAL=$R_PORTAL"
            echo "PRODUCTION_RELEASE=$RESULTADO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          echo "PRODUCTION_RELEASE=$RESULTADO"
          [ "$RESULTADO" = "SUCCESS" ] || exit 1
