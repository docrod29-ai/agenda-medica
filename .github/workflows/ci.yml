name: CI

# Puerta de calidad: en cada push y cada Pull Request corre typecheck + pruebas.
# Bloquea que se mezcle código que rompe tipos o pruebas (hallazgo de auditoría:
# "sin CI, nada impide un merge que rompe el camino clínico").
on:
  push:
    branches: [main]
  pull_request:
  # Los writers de producto empujan con GITHUB_TOKEN. GitHub pone los
  # pull_request:synchronize originados por ese token en approval-required para
  # evitar recursión. workflow_dispatch es la salida oficial para disparar CI
  # explícitamente sin esa aprobación manual.
  workflow_dispatch:

jobs:
  # Gate de seguridad clínica (unidad Nexus OS E0-11). Job SEPARADO y con nombre
  # ESTABLE a propósito: es el que se marca como *required status check* en la
  # protección de rama de `main`. Corre solo los invariantes (sin tsc ni build):
  # ~1-2 min contra los ~8-10 del job completo, así que su rojo significa una
  # sola cosa — "se rompió un invariante clínico" — y nadie tiene la tentación
  # de desactivarlo por lento. Ver docs/ci/clinical-safety-gate.md.
  clinical-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Invariantes clínicos y de seguridad
        # `clinical-safety-gate.test.ts` es el metagate (comprueba que ningún
        # invariante fue borrado, apagado o vaciado) y el `$(node ...)` expande
        # el manifiesto sellado para EJECUTARLOS de verdad.
        run: npx vitest run src/__tests__/clinical-safety-gate.test.ts $(node scripts/invariantes-clinicos.mjs)

  # Aislamiento multi-tenant contra el EMULADOR REAL (unidad Nexus OS E0-08).
  #
  # Job SEPARADO a propósito, y NO se mete en `clinical-safety` ni en `verificar`:
  #  - `clinical-safety` es el *required status check* de la rama `main`. Si el
  #    emulador falla por Java, red o un puerto ocupado, su rojo debe significar una
  #    sola cosa ("se rompió un invariante clínico"), no "el emulador tuvo un mal día".
  #  - `verificar` corre los tres gates del programa, que deben poder correr en
  #    máquinas SIN Java (los agentes del roadmap trabajan en una de ellas).
  #
  # `emulators:exec` levanta, corre, mata y propaga el código de salida: TERMINA solo.
  # `emulators:start` está prohibido en este repo (dejaría el job colgado).
  aislamiento-tenant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # El emulador de Firestore es un JAR. Se fija la JRE en vez de confiar en la
      # que traiga la imagen del runner: si mañana cambia, este job no se cae solo.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm ci
      - name: Aislamiento cross-tenant y GOLDEN FLOW contra el emulador real
        # El projectId `demo-nexusmed-test` hace que el SDK se NIEGUE a contactar un
        # proyecto real: este job no puede tocar datos de ningún consultorio.
        #
        # Desde P0-5 aquí corre también `golden-flow.emu.test.ts`: el camino que se
        # vende —paciente → cita → nota → firma → cobro— recorrido entero contra las
        # reglas REALES. Antes nadie comprobaba esa secuencia de punta a punta.
        run: npm run test:emulador

  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Pruebas (vitest)
        run: npx vitest run
      - name: Build de producción (next build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # ── Firebase: RELLENO DE BUILD, no credenciales ──────────────────────
          # La nota anterior aquí decía «el build no debe requerir credenciales de
          # runtime». La intención es correcta pero NO se cumple hoy, y el CI lo
          # demostró: `next build` reventaba con `auth/invalid-api-key` al recolectar
          # datos de páginas públicas (`/dr/[clinicId]`, `/api/public/booking`),
          # porque `src/lib/firebase.ts` llama a `initializeApp`/`getAuth` **al
          # importarse** y esas páginas usan el SDK del navegador de forma legítima.
          #
          # POR QUÉ ESTOS VALORES SON SEGUROS EN CLARO: la configuración
          # `NEXT_PUBLIC_FIREBASE_*` NO es secreta por diseño — viaja dentro del
          # bundle JavaScript a todos los navegadores de cualquier sitio Firebase.
          # Lo que protege los datos son las Firestore Rules y App Check, no el
          # secreto de la llave. Aun así aquí NO van los valores reales del Dr.:
          # son placeholders sintéticos. Al build solo le hacen falta valores con
          # FORMA válida — nunca contacta a Firebase — así que un proyecto que no
          # existe basta, y de paso garantiza que el CI no pueda tocar datos reales.
          #
          # Lo que esto NO arregla, declarado: que rutas de SERVIDOR arrastren el
          # SDK del cliente. Eso se corrigió aparte (`time-blocks-core.ts`) y el
          # invariante que impide la reincidencia vive en
          # `src/__tests__/servidor-sin-sdk-cliente.test.ts`.
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBUILD-ONLY-PLACEHOLDER-000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      # ── REG-525: la CSP se comprueba SOBRE EL ARTEFACTO, después de construirlo ──
      #
      # `csp-manifest.test.ts` lee `.next/routes-manifest.json`, que es lo que
      # Vercel consume de verdad. En el paso «Pruebas (vitest)» de arriba ese
      # archivo todavía no existe, así que sus cuatro casos se declaraban
      # SALTADOS en cada corrida del CI desde que se escribieron — un verde que
      # no medía nada. Aquí, con el build recién hecho, sí hay artefacto.
      - name: CSP del artefacto del build (routes-manifest)
        run: npx vitest run src/__tests__/csp-manifest.test.ts

  # ── A1 de la auditoría maestra: el lint YA es un gate ─────────────────────
  #
  # Exigir cero errores haría nacer el gate en rojo, y un gate que nadie puede
  # poner en verde se marca `continue-on-error` y deja de proteger — es lo que
  # pasó con el de ADRs hasta que se le puso trinquete.
  #
  # Así que la deuda se CONGELA en `docs/audit/lint-techo.json` y sólo puede
  # bajar. Si sube, el CI dice EN QUÉ ARCHIVO se añadió. Si baja, también falla:
  # pide apretar el trinquete, porque un margen que no se aprieta se lo come el
  # siguiente descuido.
  lint:
    name: lint (trinquete)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/lint-trinquete.mjs

      # ── A11Y-GATE-001: la superficie del paciente, en cero ──────────────
      #
      # Va en el job del trinquete y no en el de vitest a propósito: la
      # compuerta de verdad son las pruebas (`a11y-*.test.ts`, dentro de
      # `npx vitest run`), y esto es la SEGUNDA mirada — la que imprime en el
      # registro qué archivo y qué línea, para que quien lea un CI rojo no
      # tenga que reproducirlo en su máquina para saber qué tocar.
      #
      # No añade dependencias: el analizador usa la API del compilador de
      # TypeScript, que ya estaba en `devDependencies`.
      - run: node scripts/design/medir-a11y-superficies-paciente.mjs --detalle

  # ── P0-5: el smoke público NO corría en ningún lado ───────────────────────
  #
  # `playwright.config.ts` y dos specs existían desde hace tiempo, pero ningún
  # workflow los ejecutaba: sólo corrían si alguien se acordaba de lanzarlos a
  # mano. Una prueba que nadie corre no protege nada — es documentación con
  # sintaxis de código.
  #
  # ── 14-ago-2026: MIDE EL BUILD DEL PR, NO PRODUCCIÓN ──────────────────────
  #
  # Nació corriendo contra PRODUCCIÓN, y la razón era buena: son comprobaciones
  # de solo lectura y ahí es donde importa que las cabeceras estén bien.
  #
  # Lo que se descubrió: el grupo A3 recorre `RUTAS_PRIVADAS`, que es una lista
  # del ÁRBOL DE ESTE CHECKOUT. Cuando una rama añade una pantalla al dashboard
  # —V15 añadió `/operaciones`— el caso pregunta por una ruta que existe en el
  # código del PR y todavía no en el despliegue. El rojo que sale no dice nada
  # de la rama: dice que producción va por detrás, y desplegar es decisión del
  # dueño. Un gate que sólo se puede poner en verde desplegando no protege al PR;
  # enseña a ignorar el rojo, que es exactamente como murió el gate de ADRs.
  #
  # Así que el job mide **el artefacto que se está revisando**: build del PR y
  # `next start` en localhost (`PLAYWRIGHT_LOCAL=1`, camino que ya existía en
  # `playwright.config.ts` y en `npm run e2e:seguridad`). Medido antes de
  # cambiarlo: la matriz entera —67 casos, incluidos B1 (violaciones de CSP en
  # navegador real), B2 y C1— pasa contra el build local SIN credenciales.
  #
  # LO QUE SE PIERDE, DECLARADO: nadie vigila ya desde aquí que producción
  # conserve sus cabeceras. Esa comprobación NO desaparece — es `npm run
  # e2e:seguridad:prod` y vive donde puede actuar: en el ciclo de despliegue
  # (`.claude/rules/deployment-and-flags.md`), después de publicar. Antes de
  # desplegar, ese mismo rojo no es accionable desde un PR.
  #
  # `continue-on-error: false` — si esto se pone en amarillo deja de proteger.
  e2e-publico:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Los cinco proyectos del config cubren Chrome, Firefox, Safari, iPhone y
      # Android. En el CI se corre SÓLO chromium y se instala SÓLO chromium: los
      # cinco tardan y descargan tres motores, y lo que este gate protege —que la
      # landing cargue y que las cabeceras de seguridad estén puestas— no depende
      # del motor. La matriz completa se lanza a mano cuando se toca el diseño.
      #
      # Instalar un navegador que luego no se usa (o al revés) es el fallo obvio
      # aquí: `--project=chromium` y `install chromium` van juntos o el job muere.
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      # El artefacto que se va a medir. Los rellenos de Firebase son los mismos
      # que el job `verificar` y por la misma razón (ahí está el porqué entero):
      # el build necesita valores con FORMA válida, y un proyecto que no existe
      # garantiza además que este job no pueda tocar datos reales.
      - name: Build del PR (el artefacto que se mide)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyBUILD-ONLY-PLACEHOLDER-000000000000
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
      # `PLAYWRIGHT_LOCAL=1` levanta `npm run start` desde el propio config y
      # espera a que responda. Sin esa variable, `baseURL` vuelve a producción.
      - name: Smoke público + cabeceras de seguridad (contra el build del PR)
        run: npx playwright test --project=chromium e2e/smoke-publico.spec.ts e2e/seguridad.spec.ts
        env:
          PLAYWRIGHT_LOCAL: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      # REG-380 — el tamaño de un teléfono, sobre el MISMO chromium que ya está
      # instalado: no descarga un motor más y no alarga el job de forma
      # apreciable. Mide desbordamiento horizontal, objetivo táctil, consola
      # propia y foco visible, que es lo que hasta ahora sólo se comprobaba
      # LEYENDO el árbol.
      #
      # Lo que NO mide, y por eso WS-05 sigue sin PROVEN: el rebote de iPhone es
      # de WebKit —`overflow-anchor` y el encadenamiento elástico— y en Chromium
      # no existe. Para eso hace falta el proyecto `iphone-safari`, y ése sí
      # descarga WebKit.
      - name: La pantalla en un teléfono (Chromium, NO es un iPhone)
        run: npx playwright test --project=telefono-chromium e2e/telefono.spec.ts
        env:
          PLAYWRIGHT_LOCAL: '1'
          PLAYWRIGHT_BASE_URL: http://localhost:3000
