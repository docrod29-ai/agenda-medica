name: Ausculta Product Codex Judge

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Product PR number
        required: true
        type: string
      expected_sha:
        description: Exact immutable product PR head SHA
        required: true
        type: string

# Make every real judge run correlatable without needing job logs. Recovery uses
# this metadata to distinguish queued/in-progress/failed exact-SHA runs safely.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Ausculta-Codex-PR-{0}-SHA-{1}', inputs.pr_number, inputs.expected_sha) || format('Ausculta-Codex-PR-{0}-{1}', github.event.issue.number, github.event.comment.body) }}

concurrency:
  group: ausculta-product-codex-judge-${{ github.event.issue.number || inputs.pr_number }}
  # Never destroy an in-flight paid audit to start another request for the same
  # product PR. Recovery/exact-SHA markers prevent bounded fallback duplicates;
  # any later legitimate request queues rather than cancelling immutable work
  # before its verdict artifact can be persisted.
  cancel-in-progress: false

jobs:
  judge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '/ausculta-codex-judge '))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - name: Resolve and verify exact product PR head
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT: ${{ github.event.comment.body || '' }}
          INPUT_SHA: ${{ inputs.expected_sha || '' }}
          PR_NUMBER: ${{ github.event.issue.number || inputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$INPUT_SHA"
          if [[ -z "$expected" ]]; then
            expected="$(printf '%s' "$COMMENT" | awk '{print $2}')"
          fi
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || { echo '::error::INVALID_PR_NUMBER'; exit 89; }
          [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::INVALID_EXPECTED_SHA'; exit 90; }
          pr="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          head_sha="$(jq -r '.head.sha' <<<"$pr")"
          head_ref="$(jq -r '.head.ref' <<<"$pr")"
          head_repo="$(jq -r '.head.repo.full_name' <<<"$pr")"
          [[ "$head_ref" == product/* ]] || { echo "::error::NOT_PRODUCT_BRANCH=$head_ref"; exit 91; }
          [[ "$head_repo" == "$GITHUB_REPOSITORY" ]] || { echo '::error::FORK_NOT_ALLOWED'; exit 92; }
          [[ "$head_sha" == "$expected" ]] || { echo "::error::SHA_CHANGED expected=$expected actual=$head_sha"; exit 93; }
          echo "sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Fail closed if OpenAI credential is absent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${OPENAI_API_KEY:-}" ]] || { echo '::error::MISSING_REQUIRED_SECRET_OR_EXTERNAL_CREDENTIAL: OPENAI_API_KEY'; exit 78; }

      - name: Checkout immutable product candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Capture authoritative exact-SHA canonical CI evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          runs="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXPECTED_SHA}&event=pull_request&per_page=100")"
          ci="$(jq -c '[.workflow_runs[] | select(.name == "CI" and .head_sha == $sha)] | sort_by(.created_at) | reverse | .[0] // null' --arg sha "$EXPECTED_SHA" <<<"$runs")"
          if [[ "$ci" == "null" ]]; then
            jq -n --arg sha "$EXPECTED_SHA" '{exact_sha:$sha,canonical_ci_found:false,canonical_ci_green:false}' > codex-ci-evidence.json
          else
            jq -n --arg sha "$EXPECTED_SHA" --argjson ci "$ci" '{exact_sha:$sha,canonical_ci_found:true,canonical_ci_green:($ci.status=="completed" and $ci.conclusion=="success"),run_id:$ci.id,run_number:$ci.run_number,status:$ci.status,conclusion:$ci.conclusion,html_url:$ci.html_url,created_at:$ci.created_at,updated_at:$ci.updated_at}' > codex-ci-evidence.json
          fi
          jq -e --arg sha "$EXPECTED_SHA" '.exact_sha == $sha' codex-ci-evidence.json >/dev/null
          cat codex-ci-evidence.json

      - name: Run independent read-only Codex audit
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          effort: high
          allow-bots: true
          output-schema: |
            {"type":"object","additionalProperties":false,"required":["verdict","audited_sha","independent","read_only","findings","summary"],"properties":{"verdict":{"type":"string","enum":["PASS","FAIL","UNVERIFIABLE"]},"audited_sha":{"type":"string"},"independent":{"type":"boolean","const":true},"read_only":{"type":"boolean","const":true},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","blocking","title","evidence"],"properties":{"severity":{"type":"string","enum":["P0","P1","P2","P3"]},"blocking":{"type":"boolean"},"title":{"type":"string"},"evidence":{"type":"string"}}}},"summary":{"type":"string"}}}
          prompt: |
            AUSCULTA PRODUCT BOARD #296 — INDEPENDENT PRODUCT SLICE AUDIT.
            You are CODEX_INDEPENDENT and did not implement this candidate.
            Audit exactly the checked-out immutable SHA and the product PR slice it represents.
            Read AGENTS.md, CLAUDE.md, docs/product/CONTEXT_CANONICAL.md, docs/product/PRODUCT_BOARD.md, docs/product/DECISION_REGISTER.md, codex-ci-evidence.json and the relevant slice contract/diff.
            This is READ-ONLY. Do not edit, commit, push, merge, deploy, use network access, or start another slice.
            `codex-ci-evidence.json` is generated by the workflow from the GitHub Actions API after exact-head verification. If it records canonical_ci_green=true for git HEAD, treat that as authoritative evidence that canonical repository CI executed successfully on this exact SHA. Do not return UNVERIFIABLE solely because this read-only audit environment lacks installed dependencies or cannot rerun tests locally. Still inspect the changed tests and implementation for adequacy and identify real P0/P1 defects if present. If canonical CI is absent/not green and mandatory verification cannot otherwise be established, fail closed as UNVERIFIABLE.
            Verify mandatory acceptance criteria, NO INVENTAR, provenance, explicit uncertainty/conflict, safety boundaries, regression risk, test adequacy, and scope discipline. Run relevant local tests where useful and available.
            PASS only if mandatory criteria are verifiable and there is no P0/blocking P1. If a mandatory claim cannot be verified, return UNVERIFIABLE. P2/P3 are nonblocking unless they prove a mandatory failure.
            audited_sha MUST equal git HEAD. Return only the structured result.

      - name: Validate and persist verdict artifact
        env:
          VERDICT: ${{ steps.codex.outputs.final-message }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$VERDICT" > product-codex-verdict.json
          jq -e --arg sha "$EXPECTED_SHA" '.audited_sha == $sha and .independent == true and .read_only == true and (.verdict=="PASS" or .verdict=="FAIL" or .verdict=="UNVERIFIABLE")' product-codex-verdict.json >/dev/null
          cat product-codex-verdict.json

      - name: Upload immutable verdict
        uses: actions/upload-artifact@v4
        with:
          name: product-codex-verdict-${{ github.run_id }}
          path: product-codex-verdict.json
          if-no-files-found: error
          retention-days: 30

      - name: Classify slice gate without stopping unrelated work
        id: gate
        env:
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -r '.verdict' product-codex-verdict.json)"
          blocking_count="$(jq '[.findings[] | select(.blocking == true and (.severity == "P0" or .severity == "P1"))] | length' product-codex-verdict.json)"
          if [[ "$verdict" == "PASS" && "$blocking_count" == "0" ]]; then
            gate="PASS"
          else
            gate="BLOCKED_SLICE_ONLY"
          fi
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo '### Ausculta Product Codex Judge'
            echo "- exact SHA: \`$EXPECTED_SHA\`"
            echo "- verdict: **$verdict**"
            echo "- gate: **$gate**"
            echo "- blocking P0/P1 findings: **$blocking_count**"
            echo '- policy: P0/P1 blocks only this product slice; P2/P3 never stop unrelated reversible work.'
            echo '- immutable JSON verdict is retained as a workflow artifact even if PR-comment delivery fails.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish validated verdict to product PR (best effort transport)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.target.outputs.pr_number }}
          EXPECTED_SHA: ${{ steps.target.outputs.sha }}
          SLICE_GATE: ${{ steps.gate.outputs.gate }}
        shell: bash
        run: |
          set -euo pipefail
          verdict="$(jq -c . product-codex-verdict.json)"
          printf -v body 'AUSCULTA_CODEX_VERDICT exact_sha=%s run_id=%s gate=%s\n```json\n%s\n```' "$EXPECTED_SHA" "$GITHUB_RUN_ID" "$SLICE_GATE" "$verdict"

          published=0
          for attempt in 1 2 3; do
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null 2>&1; then
              published=1
              break
            fi
            sleep $((attempt * 2))
          done

          if [[ "$published" == "1" ]]; then
            echo '- PR comment transport: delivered.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::VERDICT_COMMENT_PUBLISH_FAILED: audit remains valid; use immutable artifact/workflow summary.'
            echo '- PR comment transport: failed after 3 attempts; **audit remains valid and workflow is not failed by transport**.' >> "$GITHUB_STEP_SUMMARY"
          fi
