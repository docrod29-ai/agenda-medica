<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ausculta">
  <!--
    ÍCONO DE APLICACIÓN DE AUSCULTA — la campana del estetoscopio.

    Reemplaza la «N» entrelazada de NexusMED, que además iba pintada con el
    azul que se retiró por no pasar contraste (REG-307).

    Aquí el color SÍ va fijo, y es la única marca donde debe ir: un ícono de
    aplicación se pinta fuera de la página —en la pantalla de inicio de un
    teléfono, en una pestaña— donde no hay tema del que heredar. El resto de
    las marcas usan `currentColor`.

    Área segura de iOS respetada: todo el contenido dentro de un margen de
    88 px (17 %), para que el recorte circular de watchOS y el squircle de
    iOS no se coman los arcos.
  -->
  <rect width="512" height="512" rx="112" fill="#0B0C0E"/>

  <g transform="translate(256 256) scale(1) translate(-256 -256)"
     fill="none" stroke="#6E84FE" stroke-linecap="round">
    <!-- El disco de la campana -->
    <circle cx="196" cy="256" r="92" stroke-width="34"/>
    <circle cx="196" cy="256" r="28" fill="#6E84FE" stroke="none"/>
    <!-- Lo que se oye -->
    <path d="M348 186a96 96 0 0 1 0 140" stroke-width="34"/>
    <path d="M418 128a182 182 0 0 1 0 256" stroke-width="34" opacity="0.45"/>
  </g>
</svg>
